<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp - O Desaparecimento de Sofia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #app { width: 100%; max-width: 480px; height: 100vh; background-color: #0b141a; display: flex; flex-direction: column; position: relative; }
    
    /* CABEÇALHOS */
    header { background-color: #202c33; padding: 12px 16px; display: flex; align-items: center; border-bottom: 1px solid #222d34; justify-content: space-between; z-index: 5; }
    .header-title { font-size: 19px; font-weight: bold; color: #8696a0; }
    .header-chat { display: flex; align-items: center; gap: 10px; width: 100%; }
    .back-btn { background: none; border: none; color: #00a884; font-size: 22px; cursor: pointer; padding-right: 6px; }
    .avatar { min-width: 40px; width: 40px; height: 40px; border-radius: 50%; background-color: #00a884; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; color: #111b21; position: relative; }
    .user-info { display: flex; flex-direction: column; flex: 1; cursor: pointer; }
    .user-name { font-weight: 600; font-size: 15px; color: #e9edef; }
    .user-status { font-size: 11px; color: #8696a0; transition: color 0.3s; }
    .user-status.online { color: #00a884; }
    
    .rel-badge { font-size: 10px; background: #111b21; padding: 4px 8px; border-radius: 12px; border: 1px solid #00a884; color: #00a884; font-weight: bold; text-align: right; }
    .reset-btn { background-color: #2a3942; border: 1px solid #3b4a54; color: #f1f1f1; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }

    /* LISTA DE CHATS */
    #chat-list-view { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; transition: background 0.2s; position: relative; }
    .chat-item:active { background-color: #202c33; }
    .chat-item-details { flex: 1; margin-left: 12px; overflow: hidden; }
    .chat-item-header { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; }
    .chat-item-name { font-size: 15px; font-weight: 600; color: #e9edef; }
    .chat-item-time { font-size: 11px; color: #8696a0; }
    .chat-item-body { display: flex; justify-content: space-between; align-items: center; }
    .chat-item-lastmsg { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 8px; }
    
    .unread-badge { background-color: #00a884; color: #111b21; font-size: 11px; font-weight: bold; border-radius: 50%; min-width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; padding: 0 4px; animation: pop 0.2s ease-out; }

    /* ECRÃ DE CHAT */
    #chat-room-view { flex: 1; display: none; flex-direction: column; height: 100%; position: relative; }
    #messages-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 10px 10px; scroll-behavior: smooth; }
    
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .msg-sender { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #00a884; }
    .received { background-color: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
    .sent { background-color: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
    .system { align-self: center; background-color: #182229; color: #ffd279; font-size: 11px; border-radius: 6px; padding: 5px 10px; text-align: center; margin: 6px 0; border: 1px solid #222d34; }
    .msg-time { font-size: 10px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; }

    /* INDICADOR DE "A ESCREVER..." */
    .typing { align-self: flex-start; background-color: #202c33; padding: 10px 14px; border-radius: 8px; border-top-left-radius: 0; display: none; margin-bottom: 6px; align-items: center; gap: 6px; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 6px; height: 6px; background-color: #8696a0; border-radius: 50%; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    #options-container { padding: 10px; background-color: #202c33; border-top: 1px solid #222d34; display: flex; flex-direction: column; gap: 8px; min-height: 60px; transition: all 0.3s ease; }
    .opt-btn { background-color: #111b21; color: #00a884; border: 1px solid #222d34; padding: 12px; border-radius: 8px; font-size: 13.5px; text-align: left; cursor: pointer; transition: transform 0.1s, background-color 0.2s; animation: fadeIn 0.3s ease-in; }
    .opt-btn:active { background-color: #222d34; transform: scale(0.98); }

    /* MODAIS */
    #name-modal, #profile-modal { position: absolute; top:0; left:0; width:100%; height:100%; background: #0b141a; display: flex; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .modal-box { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #222d34; }
    .modal-box h2 { font-size: 18px; margin-bottom: 8px; color: #00a884; }
    .modal-box p { font-size: 13px; color: #8696a0; margin-bottom: 18px; }
    .modal-box input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222d34; background: #111b21; color: #fff; font-size: 16px; margin-bottom: 14px; outline: none; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #00a884; color: #111b21; font-weight: bold; font-size: 15px; cursor: pointer; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>

<div id="app">
  <!-- MODAL INICIAL -->
  <div id="name-modal" style="display: none;">
    <div class="modal-box">
      <h2>WHATSAPP</h2>
      <p>Escreve o teu nome para iniciar a investigação de Monte Cedo.</p>
      <input type="text" id="player-name-input" placeholder="O teu nome..." maxlength="20">
      <button onclick="iniciarJogo()">INICIAR CASO</button>
    </div>
  </div>

  <!-- MODAL DE PERFIL -->
  <div id="profile-modal" style="display: none;">
    <div class="modal-box">
      <h2 id="prof-title">Perfil do Contacto</h2>
      <p id="prof-desc" style="margin-top:10px; color:#e9edef;">Informações do contacto.</p>
      
      <div style="margin: 15px 0; background:#111b21; padding:12px; border-radius:8px; border:1px solid #222d34;">
        <span style="font-size:12px; color:#8696a0;">Nível de Confiança:</span>
        <div id="prof-rel-bar" style="font-size:20px; font-weight:bold; color:#00a884; margin-top:2px;">50%</div>
        <span style="font-size:12px; color:#8696a0; display:block; margin-top:10px;">Estado da Relação:</span>
        <div id="prof-status-text" style="font-size:14px; font-weight:bold; color:#ffd279; margin-top:2px;">Neutro</div>
      </div>
      
      <button onclick="fecharPerfil()">VOLTAR</button>
    </div>
  </div>

  <!-- CABEÇALHO PRINCIPAL -->
  <header id="main-header">
    <div class="header-title">WhatsApp</div>
    <button class="reset-btn" onclick="reiniciarJogo()">↺ Reiniciar</button>
  </header>

  <!-- CABEÇALHO DO CHAT -->
  <header id="chat-header" style="display: none;">
    <div class="header-chat">
      <button class="back-btn" onclick="voltarParaLista()">❮</button>
      <div class="avatar" id="active-avatar">T</div>
      <div class="user-info" onclick="abrirPerfil()">
        <div class="user-name" id="active-name">Tomás</div>
        <div class="user-status" id="active-status">online</div>
      </div>
      <div class="rel-badge" id="active-rel">Confiança: 50%</div>
    </div>
  </header>

  <!-- LISTA DE CHATS -->
  <div id="chat-list-view"></div>

  <!-- ECRÃ DO CHAT -->
  <div id="chat-room-view">
    <div id="messages-container">
      <div class="typing" id="typing-indicator">
        <span style="font-size: 11px; color:#8696a0; margin-right: 4px;" id="typing-name">a escrever</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
    <div id="options-container"></div>
  </div>
</div>

<script>
  let playerName = localStorage.getItem('player_name_long_v6') || "";
  let activeChat = null;
  let opcoesAtivas = null;

  // GERADOR DE SONS DE SINTETIZADOR PARA EFEITO AUDITIVO SEM FICHEIROS EXTERNOS
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function tocarSom(tipo) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (tipo === 'recebido') {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08); // A5
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (tipo === 'enviado') {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.05); // E5
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      }
    } catch (e) {}
  }

  let chatData = {
    grupo: {
      name: "Monte Cedo Crew 🔍", avatar: "👥", bg: "#ff9800", status: "Inês, Tomás, Diogo, Tu",
      relacao: 50, unlocked: true, isGroup: true, unread: 0,
      desc: "Grupo de amigos de Monte Cedo. Ninguém te conhece e desconfiam de ti.",
      msgs: []
    },
    sofia: { 
      name: "Sofia ❤️", avatar: "S", bg: "#9c27b0", status: "visto por último ontem às 23:14", 
      relacao: 0, unlocked: true, isGroup: false, unread: 0,
      desc: "A rapariga desaparecida na serra. O teu número foi a última mensagem enviada.",
      msgs: [] 
    },
    ines: { 
      name: "Inês", avatar: "I", bg: "#e91e63", status: "online", 
      relacao: 30, unlocked: false, isGroup: false, unread: 0,
      desc: "A organizadora do grupo. Quer manter a ordem mas esconde medos do passado.",
      msgs: [] 
    },
    tomas: { 
      name: "Tomás", avatar: "T", bg: "#00a884", status: "online", 
      relacao: 40, unlocked: false, isGroup: false, unread: 0,
      desc: "Disposto a confiar em ti, mas oculta discussões que teve com a Sofia.",
      msgs: [] 
    },
    diogo: { 
      name: "Diogo", avatar: "D", bg: "#607d8b", status: "offline", 
      relacao: 25, unlocked: false, isGroup: false, unread: 0,
      desc: "Ex-namorado impulsivo. Tem histórico com a polícia de Monte Cedo.",
      msgs: [] 
    },
    zero: { 
      name: "??? [Anónimo]", avatar: "0", bg: "#e53935", status: "offline", 
      relacao: 15, unlocked: false, isGroup: false, unread: 0,
      desc: "Hacker que intercetou a rede. Guiar-te-á através de segredos encriptados.",
      msgs: [] 
    }
  };

  function obterHora() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function calcularEstatutoRelaCoes(rel, id) {
    if (id === 'sofia') return "Desaparecida 💔";
    if (id === 'grupo') return "Grupo de Monte Cedo 👥";
    if (id === 'zero') return "Contacto Anónimo / Hacker 🕶️";
    if (rel >= 70) return "Confiança Total ✨";
    if (rel >= 40) return "Contacto Neutro 😐";
    return "Sob Forte Suspeita ❄️";
  }

  function alterarRelacao(chatId, delta) {
    if (chatData[chatId]) {
      chatData[chatId].relacao = Math.min(100, Math.max(0, chatData[chatId].relacao + delta));
      guardarEstado();
      if (activeChat === chatId) {
        document.getElementById('active-rel').innerText = "Confiança: " + chatData[chatId].relacao + "%";
      }
    }
  }

  function reiniciarJogo() {
    if (confirm("Tens a certeza que queres reiniciar todo o progresso da investigação?")) {
      localStorage.clear();
      location.reload();
    }
  }

  window.onload = function() {
    if (!playerName) {
      document.getElementById('name-modal').style.display = 'flex';
    } else {
      carregarEstado();
    }
  };

  function iniciarJogo() {
    const input = document.getElementById('player-name-input');
    if (!input.value.trim()) return;
    playerName = input.value.trim();
    localStorage.setItem('player_name_long_v6', playerName);
    document.getElementById('name-modal').style.display = 'none';
    iniciarHistoria();
  }

  function carregarEstado() {
    const savedData = localStorage.getItem('chat_data_save_long_v6');
    if (savedData) {
      chatData = JSON.parse(savedData);
      atualizarListaGeral();
    } else {
      iniciarHistoria();
    }
  }

  function guardarEstado() {
    localStorage.setItem('chat_data_save_long_v6', JSON.stringify(chatData));
    atualizarListaGeral();
  }

  function atualizarListaGeral() {
    const listView = document.getElementById('chat-list-view');
    listView.innerHTML = '';

    Object.keys(chatData).forEach(id => {
      const chat = chatData[id];
      if (chat.unlocked) {
        const msgs = chat.msgs;
        let ultTexto = "Nenhuma mensagem...";
        let ultHora = "--:--";

        if (msgs.length > 0) {
          const ult = msgs[msgs.length - 1];
          ultTexto = ult.text ? ult.text.replace(/<[^>]*>?/gm, '') : "Ficheiro";
          if (ult.sender) ultTexto = ult.sender + ": " + ultTexto;
          ultHora = ult.time || obterHora();
        } else if (id === 'sofia') {
          ultTexto = "[Visto por último ontem às 23:14]";
          ultHora = "Ontem";
        }

        const unreadBadgeHTML = chat.unread > 0 
          ? `<div class="unread-badge">${chat.unread}</div>` 
          : '';

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => abrirChat(id);
        item.innerHTML = `
          <div class="avatar" style="background-color: ${chat.bg};">${chat.avatar}</div>
          <div class="chat-item-details">
            <div class="chat-item-header">
              <span class="chat-item-name">${chat.name}</span>
              <span class="chat-item-time" style="${chat.unread > 0 ? 'color:#00a884; font-weight:bold;' : ''}">${ultHora}</span>
            </div>
            <div class="chat-item-body">
              <div class="chat-item-lastmsg">${ultTexto}</div>
              ${unreadBadgeHTML}
            </div>
          </div>
        `;
        listView.appendChild(item);
      }
    });
  }

  function abrirChat(id) {
    activeChat = id;
    const info = chatData[id];
    
    info.unread = 0;
    guardarEstado();

    document.getElementById('main-header').style.display = 'none';
    document.getElementById('chat-list-view').style.display = 'none';
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('chat-room-view').style.display = 'flex';

    document.getElementById('active-name').innerText = info.name;
    document.getElementById('active-status').innerText = info.status;
    document.getElementById('active-avatar').innerText = info.avatar;
    document.getElementById('active-avatar').style.backgroundColor = info.bg;
    document.getElementById('active-rel').innerText = info.isGroup ? "Grupo Geral" : "Confiança: " + info.relacao + "%";

    renderizarMensagens();
    renderizarOpcoes();
  }

  function abrirPerfil() {
    if (!activeChat) return;
    const info = chatData[activeChat];
    document.getElementById('prof-title').innerText = info.name;
    document.getElementById('prof-desc').innerText = info.desc;
    document.getElementById('prof-rel-bar').innerText = info.isGroup ? "N/A" : info.relacao + "%";
    document.getElementById('prof-status-text').innerText = calcularEstatutoRelaCoes(info.relacao, activeChat);
    document.getElementById('profile-modal').style.display = 'flex';
  }

  function fecharPerfil() {
    document.getElementById('profile-modal').style.display = 'none';
  }

  function voltarParaLista() {
    activeChat = null;
    document.getElementById('chat-header').style.display = 'none';
    document.getElementById('chat-room-view').style.display = 'none';
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('chat-list-view').style.display = 'flex';
    atualizarListaGeral();
  }

  function renderizarMensagens() {
    const container = document.getElementById('messages-container');
    container.innerHTML = '';
    
    const msgs = chatData[activeChat].msgs;
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.type;
      
      let htmlContent = "";
      if (m.sender) htmlContent += `<div class="msg-sender">${m.sender}</div>`;
      if (m.type === 'system') htmlContent = m.text;
      else htmlContent += m.text + `<span class="msg-time">${m.time}</span>`;
      
      div.innerHTML = htmlContent;
      container.appendChild(div);
    });

    const typ = document.createElement('div');
    typ.className = 'typing';
    typ.id = 'typing-indicator';
    typ.innerHTML = '<span style="font-size: 11px; color:#8696a0; margin-right: 4px;" id="typing-name">a escrever</span><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    container.appendChild(typ);

    container.scrollTop = container.scrollHeight;
  }

  function renderizarOpcoes() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (opcoesAtivas && opcoesAtivas.chatId === activeChat) {
      opcoesAtivas.lista.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = o.texto;
        btn.onclick = () => {
          container.innerHTML = '';
          const acao = o.proximo;
          const delta = o.delta;
          const target = o.target;
          opcoesAtivas = null;
          
          pushMsg(activeChat, 'sent', o.texto, null, () => {
            if (delta && target) alterarRelacao(target, delta);
            setTimeout(acao, 600);
          });
        };
        container.appendChild(btn);
      });
    }
  }

  // ENVIO E RECEÇÃO NATURAL DE MENSAGENS COM TEMPOS DE DIGITAÇÃO DINÂMICOS
  function pushMsg(chatId, type, text, sender = null, callback = null) {
    if (!chatData[chatId].unlocked) chatData[chatId].unlocked = true;

    if (type === 'sent' || type === 'system') {
      const hora = obterHora();
      chatData[chatId].msgs.push({ type, text, sender, time: hora });
      guardarEstado();
      if (activeChat === chatId) {
        renderizarMensagens();
        if (type === 'sent') tocarSom('enviado');
      }
      if (callback) callback();
      return;
    }

    // Cálculo dinâmico do tempo de escrita baseado na extensão da mensagem
    const baseTyping = Math.min(Math.max(text.length * 30, 1200), 3200);
    const randomPause = Math.floor(Math.random() * 400);
    const tempoTotal = baseTyping + randomPause;

    const statusElem = document.getElementById('active-status');

    if (activeChat === chatId) {
      const typingIndicator = document.getElementById('typing-indicator');
      const typingName = document.getElementById('typing-name');
      
      if (typingIndicator) {
        typingName.innerText = sender ? `${sender} está a escrever` : "a escrever";
        typingIndicator.style.display = 'flex';
        if (statusElem) {
          statusElem.innerText = sender ? `${sender} a escrever...` : "a escrever...";
          statusElem.classList.add('online');
        }
        
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;
      }

      setTimeout(() => {
        if (typingIndicator) typingIndicator.style.display = 'none';
        if (statusElem) {
          statusElem.innerText = chatData[chatId].status;
          statusElem.classList.remove('online');
        }
        
        const hora = obterHora();
        chatData[chatId].msgs.push({ type, text, sender, time: hora });
        guardarEstado();
        if (activeChat === chatId) {
          renderizarMensagens();
          tocarSom('recebido');
        }
        if (callback) callback();
      }, tempoTotal);

    } else {
      setTimeout(() => {
        const hora = obterHora();
        chatData[chatId].msgs.push({ type, text, sender, time: hora });
        chatData[chatId].unread += 1;
        guardarEstado();
        if (callback) callback();
      }, tempoTotal / 1.5);
    }
  }

  // REDIRECIONAMENTO AUTOMÁTICO E APRESENTAÇÃO SUAVE DE OPÇÕES
  function mostrarOpcoes(chatTarget, opcoes) {
    opcoesAtivas = {
      chatId: chatTarget,
      lista: opcoes
    };
    
    // Pequeno compasso de espera natural antes de surgirem os botões de resposta
    setTimeout(() => {
      if (activeChat !== chatTarget) {
        abrirChat(chatTarget);
      } else {
        renderizarOpcoes();
      }
    }, 400);
  }

  /* ==================== ESTRUTURA NARRATIVA ==================== */

  function iniciarHistoria() {
    pushMsg('grupo', 'system', '⚠️ FOSTE ADICIONADO AO GRUPO "MONTE CEDO CREW"');
    
    pushMsg('grupo', 'received', 'Alguém me explica quem é este número que a Sofia enviou antes de desligar?!', 'Inês', () => {
      pushMsg('grupo', 'received', 'Calma Inês, não ataques logo a pessoa.', 'Tomás', () => {
        pushMsg('grupo', 'received', 'Calma?! A polícia está na casa dela e a única pista é este contacto!', 'Diogo', () => {
          abrirChat('grupo');
          mostrarOpcoes('grupo', [
            { 
              texto: "Eu nem sequer vivo na vossa cidade! Não faço ideia de quem é a Sofia!", 
              target: "tomas", delta: +10,
              proximo: () => cap1_desenvolvimento("compreensivo") 
            },
            { 
              texto: "Quem são vocês para me falarem assim? Apaguem o meu número!", 
              target: "ines", delta: -10,
              proximo: () => cap1_desenvolvimento("agressivo") 
            }
          ]);
        });
      });
    });
  }

  function cap1_desenvolvimento(estilo) {
    if (estilo === "compreensivo") {
      pushMsg('grupo', 'received', 'Se não a conheces, por que motivo é que ela guardou o teu contacto com a nota "EMERGÊNCIA"?', 'Inês', () => {
        pushMsg('grupo', 'received', 'Viram? Há algo que não bate certo.', 'Tomás', () => {
          pushMsg('tomas', 'system', '🔒 MENSAGEM PRIVADA');
          pushMsg('tomas', 'received', 'Desculpa a agressividade da Inês. Estamos todos em choque desde ontem à noite.', 'Tomás', () => {
            pushMsg('tomas', 'received', 'Chamo-me Tomás. Acredito que estejas confuso/a, mas por favor não vás embora.', 'Tomás');
          });
        });
      });

    } else {
      pushMsg('grupo', 'received', 'Não apagamos nada! Se a Sofia te mandou o número, tu estás envolvido!', 'Diogo', () => {
        pushMsg('grupo', 'received', 'A calma não nos vai ajudar a encontrá-la.', 'Inês', () => {
          pushMsg('ines', 'system', '🔒 MENSAGEM PRIVADA');
          pushMsg('ines', 'received', 'Ouve aqui, ' + playerName + '. Eu controlo este grupo. Se não colaborares, levo o teu número à esquadra.', 'Inês');
        });
      });
    }

    setTimeout(() => {
      pushMsg('zero', 'system', '⚠️ MENSAGEM ENCRIPTADA');
      pushMsg('zero', 'received', 'Aviso: Não confies em nenhum deles por enquanto.', '???', () => {
        pushMsg('zero', 'received', 'Eu usei o telemóvel da Sofia para enviar o teu contacto para o grupo.', '???', () => {
          pushMsg('zero', 'received', 'Precisava de uma pessoa neutra, totalmente fora de Monte Cedo, para me ajudar a desmascará-los.', '???', () => {
            cap2_investigacao_inicial();
          });
        });
      });
    }, 2200);
  }

  function cap2_investigacao_inicial() {
    pushMsg('zero', 'received', 'A Sofia deixou dois caminhos antes de sumir na serra: um diário no quarto e um registo de chamadas apagado.', '???', () => {
      pushMsg('zero', 'received', 'Qual pista queres que eu investigue em primeiro lugar?', '???', () => {
        mostrarOpcoes('zero', [
          { 
            texto: "Analisa o registo de chamadas apagado no telemóvel dela.", 
            target: "zero", delta: +10,
            proximo: () => cap2_ramificacao("chamadas") 
          },
          { 
            texto: "Pede ao Tomás para procurar o diário no quarto da Sofia.", 
            target: "tomas", delta: +10,
            proximo: () => cap2_ramificacao("diario") 
          }
        ]);
      });
    });
  }

  function cap2_ramificacao(escolha) {
    if (escolha === "chamadas") {
      pushMsg('zero', 'received', 'Descobri três chamadas feitas ontem às 22:30 para o Diogo. Todas foram rejeitadas.', '???', () => {
        pushMsg('diogo', 'system', '🔒 MENSAGEM PRIVADA');
        pushMsg('diogo', 'received', 'Se andas a fazer perguntas sobre mim no grupo, é bom que pares.', 'Diogo', () => {
          cap3_alibi_interrogatorio();
        });
      });
    } else {
      pushMsg('tomas', 'received', 'Consegui entrar no quarto dela antes da polícia fechar o acesso! Encontrei o diário com páginas arrancadas.', 'Tomás', () => {
        pushMsg('tomas', 'received', 'A última frase diz: "Ele descobriu o que fizemos no ano passado na serra."', 'Tomás', () => {
          cap3_alibi_interrogatorio();
        });
      });
    }
  }

  function cap3_alibi_interrogatorio() {
    pushMsg('grupo', 'received', 'Pessoal, o inspetor da polícia quer saber onde cada um esteve entre as 21h e as 23h!', 'Inês', () => {
      pushMsg('grupo', 'received', 'Eu estava em casa a estudar com a Inês.', 'Tomás', () => {
        pushMsg('grupo', 'received', 'Isso é mentira! Eu vi o carro do Tomás perto da estrada da serra às 22h!', 'Diogo', () => {
          pushMsg('grupo', 'received', 'Diogo, tu nem deverias estar na rua a essa hora! Tinhas a medida de coação!', 'Inês', () => {
            mostrarOpcoes('grupo', [
              { 
                texto: "Tomás, estás a mentir sobre o teu álibi? Conta a verdade!", 
                target: "tomas", delta: -10,
                proximo: () => cap4_segredo_revelado("confrontar_tomas") 
              },
              { 
                texto: "Diogo, porque é que estavas a perseguir o carro do Tomás?", 
                target: "diogo", delta: -10,
                proximo: () => cap4_segredo_revelado("confrontar_diogo") 
              }
            ]);
          });
        });
      });
    });
  }

  function cap4_segredo_revelado(foco) {
    if (foco === "confrontar_tomas") {
      pushMsg('tomas', 'received', 'Está bem! Eu admito no privado... Fui à serra porque a Sofia me pediu ajuda para esconder umas caixas.', 'Tomás', () => {

          cap5_a_fotografia_pista();
        });
      });
    } else {
      pushMsg('diogo', 'received', 'Eu segui o Tomás porque sabia que ele andava a encontrar-se com a Sofia às escondidas da Inês!', 'Diogo', () => {
        pushMsg('diogo', 'received', 'Eles tinham um plano para sair de Monte Cedo esta semana!', 'Diogo', () => {
          cap5_a_fotografia_pista();
        });
      });
    }
  }

  function cap5_a_fotografia_pista() {
    pushMsg('zero', 'received', 'Consegui recuperar um ficheiro de imagem do telemóvel da Sofia!', '???', () => {
      pushMsg('zero', 'received', 'É uma foto tirada na antiga Estação de Tratamento de Água de Monte Cedo. Vê-se um portão trancado com um símbolo vermelho.', '???', () => {
        pushMsg('ines', 'received', playerName + ', a mãe da Sofia disse que ela guardava um duplicado das chaves da Estação num cofre.', 'Inês', () => {

                texto: "Tenta o ano de fundação de Monte Cedo: 1998.", 
                target: "ines", delta: +5,
                proximo: () => cap6_expedicao_serra("1998") 
              },
              { 
                texto: "Usa a data do desaparecimento no ano passado: 1408.", 
                target: "zero", delta: +10,
                proximo: () => cap6_expedicao_serra("1408") 
              }
            ]);
          });
        });
      });
    });
  }

  function cap6_expedicao_serra(codigo) {
    pushMsg('grupo', 'system', '🌲 EXPEDIÇÃO À SERRA INICIADA');
    pushMsg('grupo', 'received', 'O código ' + codigo + ' funcionou no cofre!! Encontramos o mapa antigo!', 'Inês', () => {
      pushMsg('grupo', 'received', 'Eu e o Diogo estamos a subir a serra agora de carro. Está um nevoeiro cerrado.', 'Tomás', () => {
        pushMsg('zero', 'received', 'ALERTA! O GPS do carro do Tomás está a desviar-se da rota principal.', '???', () => {
          pushMsg('zero', 'received', 'Alguém alterou os sinais da estrada de propósito para os levar até à ravina abandonada!', '???', () => {
            mostrarOpcoes('zero', [
              { 
                texto: "Liga para o Tomás imediatamente e manda-o parar o carro!", 
                target: "tomas", delta: +15,
                proximo: () => cap7_resgate("parar") 
              },
              { 
                texto: "Avisa a Inês para cortar o caminho pelo atalho da pedreira!", 
                target: "ines", delta: +10,
                proximo: () => cap7_resgate("atalho") 
              }
            ]);
          });
        });
      });
    });
  }

  function cap7_resgate(acao) {
    if (acao === "parar") {
      pushMsg('tomas', 'received', 'Ainda bem que ligaste!! Travámos a escassos metros de uma queda de terra na estrada!', 'Tomás', () => {
        pushMsg('tomas', 'received', 'Alguém cortou as barreiras de proteção da estrada de propósito!', 'Tomás', () => {
          cap8_o_suspeito_oculto();
        });
      });
    } else {
      pushMsg('ines', 'received', 'Cheguei ao atalho! Encontrei um carro preto abandonado com a porta aberta!', 'Inês', () => {
        cap8_o_suspeito_oculto();
      });
    }
  }

  function cap8_o_suspeito_oculto() {
    pushMsg('zero', 'received', 'Analisei as matrículas da zona da pedreira.', '???', () => {
      pushMsg('zero', 'received', 'O carro pertence ao antigo vigilante da serra, que foi despedido após uma queixa da Sofia.', '???', () => {
        pushMsg('zero', 'received', 'Mas há algo pior: ele recebia pagamentos semanais feitos pela conta bancária de um dos teus contactos!', '???', () => {
          pushMsg('grupo', 'received', 'Encontramos um cativeiro no subterrâneo da estação de água!!', 'Diogo', () => {
            pushMsg('grupo', 'received', 'A porta está trancada por dentro e ouvimos barulho lá dentro!', 'Inês', () => {
              mostrarOpcoes('grupo', [
                { 
                  texto: "Pergunta no grupo quem é que transferiu dinheiro ao vigilante!", 
                  target: "grupo", delta: -10,

                },
                { 
                  texto: "Pede ao Zero para bloquear remotamente os acessos do vigilante!", 
                  target: "zero", delta: +15,
                  proximo: () => cap9_a_armadilha_final("bloqueio_hacker") 
                }
              ]);
            });
          });
        });
      });
    });
  }

  function cap9_a_armadilha_final(estratega) {
    if (estratega === "confronto_direto") {
      pushMsg('ines', 'received', 'O quê?! A conta do meu pai foi usada para essas transferências sem ele saber?!', 'Inês', () => {
        pushMsg('diogo', 'received', 'Eu sabia que a tua família estava metida nisto, Inês!', 'Diogo', () => {
          cap10_climax_e_finais();
        });
      });
    } else {
      pushMsg('zero', 'received', 'Consegui desativar os trincos eletrónicos das portas do bunker!', '???', () => {
        cap10_climax_e_finais();
      });
    }
  }

  function cap10_climax_e_finais() {
    pushMsg('grupo', 'system', '🚨 APROXIMAÇÃO AO CATIVEIRO');
    pushMsg('grupo', 'received', 'A porta abriu-se! Vemos a Sofia!', 'Tomás', () => {
      pushMsg('grupo', 'received', 'O raptor está encurralado na sala das máquinas! Ele diz que só fala com a pessoa que o descobriu no chat!', 'Inês', () => {
        mostrarOpcoes('grupo', [
          { 
            texto: "Manda a polícia entrar imediatamente antes que ele fuja pelos túneis!", 
            target: "grupo", delta: +10,
            proximo: () => processarFinal("policia") 
          },
          { 
            texto: "Zero, expõe as gravações de áudio do sistema para o desarmar moralmente!", 
            target: "zero", delta: +20,
            proximo: () => processarFinal("hacker") 
          },
          { 
            texto: "Tomás e Diogo, entrem juntos e garantam a segurança da Sofia!", 
            target: "tomas", delta: +10,
            proximo: () => processarFinal("amigos") 
          }
        ]);
      });
    });
  }

  function processarFinal(decisao) {
    pushMsg('grupo', 'system', '🎬 RESOLUÇÃO DO CASO DE MONTE CEDO');

    const relTomas = chatData.tomas.relacao;
    const relZero = chatData.zero.relacao;

    if (decisao === "hacker" || relZero >= 40) {
      pushMsg('zero', 'received', 'O plano funcionou na perfeição, ' + playerName + '. O raptor rendeu-se quando percebeu que tínhamos todas as provas transmitidas em direto.', '???', () => {
        pushMsg('grupo', 'received', 'A Sofia está a salvo e a caminho do hospital! O culpado foi detido!', 'Inês', () => {
          pushMsg('sofia', 'system', '🔓 MENSAGEM RECEBIDA');
          pushMsg('sofia', 'received', 'Obrigada por teres sido a minha luz no escuro ' + playerName + '. Guardei o teu número porque sabia que só alguém de fora conseguiria ver a verdade. ❤️', 'Sofia', () => {
            alert("🏆 FINAL A: Investigador Brilhante! Salvaste a Sofia e desmascaraste a conspiração com o Hacker Zero!");
          });
        });
      });

    } else if (decisao === "amigos" || relTomas >= 50) {
      pushMsg('tomas', 'received', 'Conseguimos! Eu e o Diogo deitámos a porta abaixo e tirámos a Sofia antes que ele reagisse!', 'Tomás', () => {
        pushMsg('grupo', 'received', 'A Sofia está bem! Uniste o nosso grupo quando estávamos prestes a destruir-nos.', 'Inês', () => {
          alert("🎉 FINAL B: Aliança Restaurada! Salvaste a Sofia e uniste os amigos de Monte Cedo!");
        });
      });

    } else {
      pushMsg('grupo', 'received', 'A polícia efetuou a prisão, mas o cúmplice conseguiu escapar pelos túneis antigos...', 'Inês', () => {
        pushMsg('grupo', 'received', 'A Sofia foi resgatada, mas a neblina de suspeitas nunca abandonará Monte Cedo.', 'Tomás', () => {
          alert("⚠️ FINAL C: Resgate Parcial! A Sofia foi salva, mas os segredos de Monte Cedo permaneceram nas sombras.");
        });
      });
    }
  }
</script>
