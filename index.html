<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#075e54">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #app { width: 100%; max-width: 480px; height: 100vh; background-color: #0b141a; display: flex; flex-direction: column; position: relative; }
    
    header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; border-bottom: 1px solid #222d34; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #00a884; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; color: #111b21; margin-right: 12px; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 600; font-size: 16px; color: #e9edef; }
    .user-status { font-size: 12px; color: #8696a0; }

    #chat-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 10px 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.4; word-wrap: break-word; position: relative; animation: fadeIn 0.2s ease-in-out; }
    .received { background-color: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
    .sent { background-color: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
    .system { align-self: center; background-color: #182229; color: #ffd279; font-size: 11px; border-radius: 6px; padding: 5px 10px; text-align: center; margin: 8px 0; border: 1px solid #222d34; }
    
    .chat-img { width: 100%; max-width: 260px; border-radius: 8px; margin-top: 4px; border: 1px solid #222d34; }

    .msg-time { font-size: 10px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; }
    .ticks { color: #53bdeb; margin-left: 2px; }

    .typing { align-self: flex-start; background-color: #202c33; padding: 10px 16px; border-radius: 8px; border-top-left-radius: 0; display: none; }
    .dots { display: flex; gap: 4px; }
    .dot { width: 5px; height: 5px; background-color: #8696a0; border-radius: 50%; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    #options-container { padding: 10px; background-color: #202c33; border-top: 1px solid #222d34; display: flex; flex-direction: column; gap: 6px; }
    .opt-btn { background-color: #111b21; color: #00a884; border: 1px solid #222d34; padding: 12px; border-radius: 8px; font-size: 14px; text-align: left; cursor: pointer; }
    .opt-btn:active { background-color: #222d34; }

    #name-modal { position: absolute; top:0; left:0; width:100%; height:100%; background: #0b141a; display: flex; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .modal-box { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #222d34; }
    .modal-box h2 { font-size: 18px; margin-bottom: 8px; color: #00a884; }
    .modal-box p { font-size: 13px; color: #8696a0; margin-bottom: 18px; }
    .modal-box input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222d34; background: #111b21; color: #fff; font-size: 16px; margin-bottom: 14px; outline: none; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #00a884; color: #111b21; font-weight: bold; font-size: 15px; cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>

<div id="app">
  <div id="name-modal" style="display: none;">
    <div class="modal-box">
      <h2>WHATSAPP</h2>
      <p>Introduz o teu nome para sincronizar a conta de mensagens.</p>
      <input type="text" id="player-name-input" placeholder="O teu nome..." maxlength="20">
      <button onclick="iniciarJogo()">ENTRAR NO CHAT</button>
    </div>
  </div>

  <header>
    <div class="avatar" id="avatar-icon">T</div>
    <div class="user-info">
      <div class="user-name" id="contact-name">Tomás</div>
      <div class="user-status" id="contact-status">online</div>
    </div>
  </header>

  <div id="chat-container">
    <div class="typing" id="typing-indicator">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>
  </div>

  <div id="options-container"></div>
</div>

<script>
  let playerName = localStorage.getItem('player_name_pwa') || "";
  const chat = document.getElementById('chat-container');
  const typing = document.getElementById('typing-indicator');
  const options = document.getElementById('options-container');

  function obterHora() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  // GUARDA E RECUPERA HISTÓRICO NO NAVEGADOR
  function guardarProgresso(etapa) {
    localStorage.setItem('jogo_progresso_etapa', etapa);
    localStorage.setItem('jogo_chat_html', chat.innerHTML);
  }

  window.onload = function() {
    if (!playerName) {
      document.getElementById('name-modal').style.display = 'flex';
    } else {
      const etapaGuardada = localStorage.getItem('jogo_progresso_etapa');
      const chatGuardado = localStorage.getItem('jogo_chat_html');
      
      if (etapaGuardada && chatGuardado) {
        chat.innerHTML = chatGuardado;
        // Reativa o elemento typing que foi sobrescrito
        const newTyping = document.createElement('div');
        newTyping.className = 'typing';
        newTyping.id = 'typing-indicator';
        newTyping.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
        chat.appendChild(newTyping);
        
        carregarEtapaGuardada(etapaGuardada);
      } else {
        carregarCapitulo2();
      }
    }
  };

  function iniciarJogo() {
    const input = document.getElementById('player-name-input');
    if (!input.value.trim()) return;
    playerName = input.value.trim();
    localStorage.setItem('player_name_pwa', playerName);
    document.getElementById('name-modal').style.display = 'none';
    carregarCapitulo2();
  }

  function adicionarMensagemSistema(texto) {
    const div = document.createElement('div');
    div.className = 'msg system';
    div.innerText = texto;
    chat.insertBefore(div, document.getElementById('typing-indicator'));
    chat.scrollTop = chat.scrollHeight;
  }

  function enviarMensagemNPC(texto, atraso, callback) {
    const typ = document.getElementById('typing-indicator');
    if(typ) typ.style.display = 'block';
    chat.scrollTop = chat.scrollHeight;
    
    setTimeout(() => {
      if(typ) typ.style.display = 'none';
      const div = document.createElement('div');
      div.className = 'msg received';
      div.innerHTML = texto + `<span class="msg-time">${obterHora()}</span>`;
      chat.insertBefore(div, document.getElementById('typing-indicator'));
      chat.scrollTop = chat.scrollHeight;
      if (callback) callback();
    }, atraso);
  }

  function enviarImagemNPC(url, legenda, atraso, callback) {
    const typ = document.getElementById('typing-indicator');
    if(typ) typ.style.display = 'block';
    chat.scrollTop = chat.scrollHeight;

    setTimeout(() => {
      if(typ) typ.style.display = 'none';
      const div = document.createElement('div');
      div.className = 'msg received';
      div.innerHTML = `<img src="${url}" class="chat-img" alt="Pista Visual"><br>${legenda}<span class="msg-time">${obterHora()}</span>`;
      chat.insertBefore(div, document.getElementById('typing-indicator'));
      chat.scrollTop = chat.scrollHeight;
      if (callback) callback();
    }, atraso);
  }

  function enviarMensagemJogador(texto) {
    const div = document.createElement('div');
    div.className = 'msg sent';
    div.innerHTML = texto + `<span class="msg-time">${obterHora()} <span class="ticks">✓✓</span></span>`;
    chat.insertBefore(div, document.getElementById('typing-indicator'));
    chat.scrollTop = chat.scrollHeight;
  }

  function mostrarOpcoes(listaOpcoes) {
    options.innerHTML = '';
    listaOpcoes.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = opt.texto;
      btn.onclick = () => {
        options.innerHTML = '';
        enviarMensagemJogador(opt.texto);
        setTimeout(opt.proximo, 800);
      };
      options.appendChild(btn);
    });
  }

  /* FLUXO DO CAPÍTULO 2 COM SAVES */

  function carregarCapitulo2() {
    adicionarMensagemSistema("🔒 CAPÍTULO 2: O ENVELOPE E A PISTA");
    
    enviarMensagemNPC("Desculpa a demora, " + playerName + "! Fui ver quem estava no corredor.", 2000, () => {
      enviarMensagemNPC("Não estava ninguém... mas deixaram um envelope pardo ranhurado debaixo da porta.", 2500, () => {
        enviarMensagemNPC("Tinha apenas esta nota dobrada lá dentro. Vê isto:", 2000, () => {
          enviarImagemNPC(
            "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80",
            "<i>Nota encontrada no envelope pardo.</i>",
            3000,
            () => {
              enviarMensagemNPC("Está escrito: 'SE QUERES A SOFIA, NÃO CONFIES NO " + playerName.toUpperCase() + "'.", 3000, () => {
                enviarMensagemNPC("Meteu o TEU nome na nota! Como é que quem deixou isto sabe quem tu és?!", 2500, () => {
                  mostrarOpcoes([
                    { texto: "Eu juro que não sei de nada! Estão a tentar incriminar-me!", proximo: () => cap2_resposta("incriminar") },
                    { texto: "Tomás, pensa comigo: se eu estivesse envolvido, tinha atendido a tua mensagem?", proximo: () => cap2_resposta("logica") },
                    { texto: "Quem mais sabia que estávamos a falar neste chat?", proximo: () => cap2_resposta("suspeito") }
                  ]);
                  guardarProgresso("cap2_escolha_1");
                });
              });
            }
          );
        });
      });
    });
  }

  function cap2_resposta(tipo) {
    let msg = "";
    if (tipo === "incriminar") msg = "Eu quero acreditar em ti... mas isto é demasiado estranho.";
    if (tipo === "logica") msg = "Tens razão... Se fosses tu, terias simplesmente bloqueado o meu número.";
    if (tipo === "suspeito") msg = "Ninguém! Eu só falei contigo... A menos que o telemóvel da Sofia esteja a ser monitorizado.";

    enviarMensagemNPC(msg, 2000, () => {
      cap2_transicao_hacker();
    });
  }

  function cap2_transicao_hacker() {
    enviarMensagemNPC("Espera... recebi um aviso do sistema do telemóvel. Há uma nova conversa a ser forçada no meu ecrã.", 2500, () => {
      adicionarMensagemSistema("⚠️ UTILIZADOR 'ZERO' ENTROU NA CONVERSA");
      
      setTimeout(() => {
        document.getElementById('contact-name').innerText = "Zero [Desconhecido]";
        document.getElementById('avatar-icon').innerText = "0";
        document.getElementById('avatar-icon').style.backgroundColor = "#e53935";
        
        enviarMensagemNPC("Não percas tempo a acusar o " + playerName + ", Tomás.", 2000, () => {
          enviarMensagemNPC("Quem deixou essa nota queria exatamente que vocês se virassem um contra o outro.", 2500, () => {
            enviarMensagemNPC("Eu sou quem esteve a vigiar o fórum de Monte Cedo. E sei exatamente onde a Sofia esteve há 3 horas.", 3000, () => {
              mostrarOpcoes([
                { texto: "Quem és tu? Como entraste neste chat?", proximo: () => cap2_zero_resp("identidade") },
                { texto: "Onde é que a Sofia esteve? Diz-nos!", proximo: () => cap2_zero_resp("pista") }
              ]);
              guardarProgresso("cap2_zero_espera");
            });
          });
        });
      }, 1500);
    });
  }

  function cap2_zero_resp(tipo) {
    let msg1 = tipo === "identidade" ? 
      "A minha identidade não importa. O que importa é que sou a única pessoa com acesso às câmaras do posto de combustível da serra." :
      "No posto de combustível na saída de Monte Cedo. O carro dela foi filmado pelas câmaras de segurança.";
    
    enviarMensagemNPC(msg1, 2500, () => {
      enviarMensagemNPC("A Sofia passou lá às 18:40. Alguém no banco do passageiro estava a segurar o telemóvel dela.", 2500, () => {
        adicionarMensagemSistema("⏸️ FIM DO CAPÍTULO 2 - Aguardando descodificação do vídeo...");
        guardarProgresso("cap2_fim");
      });
    });
  }

  function carregarEtapaGuardada(etapa) {
    if (etapa === "cap2_escolha_1") {
      mostrarOpcoes([
        { texto: "Eu juro que não sei de nada! Estão a tentar incriminar-me!", proximo: () => cap2_resposta("incriminar") },
        { texto: "Tomás, pensa comigo: se eu estivesse envolvido, tinha atendido a tua mensagem?", proximo: () => cap2_resposta("logica") },
        { texto: "Quem mais sabia que estávamos a falar neste chat?", proximo: () => cap2_resposta("suspeito") }
      ]);
    } else if (etapa === "cap2_zero_espera") {
      document.getElementById('contact-name').innerText = "Zero [Desconhecido]";
      document.getElementById('avatar-icon').innerText = "0";
      document.getElementById('avatar-icon').style.backgroundColor = "#e53935";
      mostrarOpcoes([
        { texto: "Quem és tu? Como entraste neste chat?", proximo: () => cap2_zero_resp("identidade") },
        { texto: "Onde é que a Sofia esteve? Diz-nos!", proximo: () => cap2_zero_resp("pista") }
      ]);
    } else if (etapa === "cap2_fim") {
      document.getElementById('contact-name').innerText = "Zero [Desconhecido]";
      document.getElementById('avatar-icon').innerText = "0";
      document.getElementById('avatar-icon').style.backgroundColor = "#e53935";
      options.innerHTML = `<div style="text-align:center; padding:10px; color:#8696a0; font-size:13px;">O teu progresso está guardado! Aguarda pelo Capítulo 3.</div>`;
    }
  }
</script>

</body>
</html>
