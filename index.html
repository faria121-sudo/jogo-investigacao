<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #app { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; background-color: #0b141a; display: flex; flex-direction: column; position: relative; }
    
    header { background-color: #202c33; padding: 12px 16px; display: flex; align-items: center; border-bottom: 1px solid #222d34; justify-content: space-between; z-index: 5; flex-shrink: 0; }
    .header-title { font-size: 19px; font-weight: bold; color: #8696a0; }
    .header-chat { display: flex; align-items: center; gap: 10px; width: 100%; }
    .back-btn { background: none; border: none; color: #00a884; font-size: 22px; cursor: pointer; padding-right: 6px; }
    
    .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; flex: 1; cursor: pointer; }
    .user-name { font-weight: 600; font-size: 15px; color: #e9edef; }
    .user-status { font-size: 11px; color: #8696a0; }
    
    .reset-btn { background-color: #2a3942; border: 1px solid #3b4a54; color: #f1f1f1; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }

    #chat-list-view { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; transition: background 0.2s; position: relative; }
    .chat-item:active { background-color: #202c33; }
    .chat-item-details { flex: 1; margin-left: 12px; overflow: hidden; }
    .chat-item-header { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; }
    .chat-item-name { font-size: 15px; font-weight: 600; color: #e9edef; }
    .chat-item-time { font-size: 11px; color: #8696a0; }
    .chat-item-body { display: flex; justify-content: space-between; align-items: center; }
    .chat-item-lastmsg { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .unread-badge { background-color: #00a884; color: #111b21; font-size: 11px; font-weight: bold; border-radius: 50%; min-width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; padding: 0 4px; }

    #chat-room-view { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
    #messages-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 10px 10px; scroll-behavior: smooth; }
    
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; animation: slideUp 0.25s ease; }
    .received { background-color: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
    .sent { background-color: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
    .msg-time { font-size: 10px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; }
    .msg-img { width: 100%; border-radius: 6px; margin-top: 4px; margin-bottom: 2px; cursor: pointer; }

    .typing { align-self: flex-start; background-color: #202c33; padding: 10px 14px; border-radius: 8px; border-top-left-radius: 0; display: none; margin-bottom: 6px; align-items: center; gap: 6px; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 6px; height: 6px; background-color: #8696a0; border-radius: 50%; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    #options-container { padding: 10px; background-color: #202c33; border-top: 1px solid #222d34; display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; flex-shrink: 0; }
    .opt-btn { background-color: #111b21; color: #00a884; border: 1px solid #222d34; padding: 12px; border-radius: 8px; font-size: 13.5px; text-align: left; cursor: pointer; transition: background-color 0.2s; line-height: 1.3; }
    .opt-btn:active { background-color: #222d34; }

    #name-modal { position: absolute; top:0; left:0; width:100%; height:100%; background: #0b141a; display: flex; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .modal-box { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #222d34; }
    .modal-box h2 { font-size: 18px; margin-bottom: 8px; color: #00a884; }
    .modal-box p { font-size: 13px; color: #8696a0; margin-bottom: 18px; line-height: 1.4; }
    .modal-box input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222d34; background: #111b21; color: #fff; font-size: 16px; margin-bottom: 14px; outline: none; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #00a884; color: #111b21; font-weight: bold; font-size: 15px; cursor: pointer; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>

<div id="app">
  <div id="name-modal" style="display: flex;">
    <div class="modal-box">
      <h2>WHATSAPP</h2>
      <p>Estás em casa numa noite chuvosa. Insere o teu nome verdadeiro para começar a receber mensagens.</p>
      <input type="text" id="player-name-input" placeholder="O teu nome..." maxlength="20">
      <button onclick="iniciarJogo()">LIGAR TELEMÓVEL</button>
    </div>
  </div>

  <header id="main-header">
    <div class="header-title">WhatsApp</div>
    <button class="reset-btn" onclick="reiniciarJogo()">↺ Reiniciar</button>
  </header>

  <header id="chat-header" style="display: none;">
    <div class="header-chat">
      <button class="back-btn" onclick="voltarParaLista()">❮</button>
      <img id="active-avatar-img" class="avatar-img" src="" alt="Avatar">
      <div class="user-info">
        <div class="user-name" id="active-name">Desconhecido</div>
        <div class="user-status" id="active-status">online</div>
      </div>
    </div>
  </header>

  <div id="chat-list-view"></div>

  <div id="chat-room-view">
    <div id="messages-container">
      <div class="typing" id="typing-indicator">
        <span style="font-size: 11px; color:#8696a0; margin-right: 4px;">a escrever</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
    <div id="options-container"></div>
  </div>
</div>

<script>
  let playerName = localStorage.getItem('player_name_v20') || "";
  let activeChat = null;
  let opcoesAtivas = null;

  const chatData = {
    carolina: {
      name: "Carolina (Desconhecida)", 
      avatarImg: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80",
      status: "online", unlocked: true, unread: 0, msgs: []
    },
    tomas: {
      name: "Tomás", 
      avatarImg: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80",
      status: "online", unlocked: true, unread: 0, msgs: []
    },
    ines: {
      name: "Inês", 
      avatarImg: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=150&auto=format&fit=crop&q=80",
      status: "online", unlocked: true, unread: 0, msgs: []
    },
    estranho: {
      name: "Número Desconhecido", 
      avatarImg: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150&auto=format&fit=crop&q=80",
      status: "offline", unlocked: false, unread: 0, msgs: []
    }
  };

  function obterHora() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function reiniciarJogo() {
    if (confirm("Reiniciar a história do início?")) {
      localStorage.clear();
      location.reload();
    }
  }

  window.onload = function() {
    if (playerName) {
      document.getElementById('name-modal').style.display = 'none';
      carregarEstado();
    }
  };

  function iniciarJogo() {
    const input = document.getElementById('player-name-input');
    if (!input.value.trim()) return;
    playerName = input.value.trim();
    localStorage.setItem('player_name_v20', playerName);
    document.getElementById('name-modal').style.display = 'none';
    iniciarCapitulo1();
  }

  function carregarEstado() {
    const savedData = localStorage.getItem('chat_data_v20');
    if (savedData) {
      Object.assign(chatData, JSON.parse(savedData));
      atualizarListaGeral();
    } else {
      iniciarCapitulo1();
    }
  }

  function guardarEstado() {
    localStorage.setItem('chat_data_v20', JSON.stringify(chatData));
    atualizarListaGeral();
  }

  function atualizarListaGeral() {
    const listView = document.getElementById('chat-list-view');
    listView.innerHTML = '';

    Object.keys(chatData).forEach(id => {
      const chat = chatData[id];
      if (chat.unlocked) {
        const msgs = chat.msgs;
        let ultTexto = "Nenhuma mensagem...";
        let ultHora = "--:--";

        if (msgs.length > 0) {
          const ult = msgs[msgs.length - 1];
          ultTexto = ult.text ? ult.text.replace(/<[^>]*>?/gm, '') : "[Fotografia]";
          ultHora = ult.time || obterHora();
        }

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => abrirChat(id);
        item.innerHTML = `
          <img src="${chat.avatarImg}" class="avatar-img">
          <div class="chat-item-details">
            <div class="chat-item-header">
              <span class="chat-item-name">${chat.name}</span>
              <span class="chat-item-time">${ultHora}</span>
            </div>
            <div class="chat-item-body">
              <div class="chat-item-lastmsg">${ultTexto}</div>
              ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
            </div>
          </div>
        `;
        listView.appendChild(item);
      }
    });
  }

  function abrirChat(id) {
    activeChat = id;
    const info = chatData[id];
    info.unread = 0;
    guardarEstado();

    document.getElementById('main-header').style.display = 'none';
    document.getElementById('chat-list-view').style.display = 'none';
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('chat-room-view').style.display = 'flex';

    document.getElementById('active-name').innerText = info.name;
    document.getElementById('active-status').innerText = info.status;
    document.getElementById('active-avatar-img').src = info.avatarImg;

    renderizarMensagens();
    renderizarOpcoes();
  }

  function voltarParaLista() {
    activeChat = null;
    document.getElementById('chat-header').style.display = 'none';
    document.getElementById('chat-room-view').style.display = 'none';
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('chat-list-view').style.display = 'flex';
    atualizarListaGeral();
  }

  function renderizarMensagens() {
    const container = document.getElementById('messages-container');
    container.innerHTML = '';
    
    if (!activeChat) return;
    const msgs = chatData[activeChat].msgs;
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.type;
      let htmlContent = "";
      if (m.img) htmlContent += `<img src="${m.img}" class="msg-img" onclick="window.open('${m.img}')">`;
      if (m.text) htmlContent += m.text;
      htmlContent += `<span class="msg-time">${m.time}</span>`;
      div.innerHTML = htmlContent;
      container.appendChild(div);
    });

    const typ = document.createElement('div');
    typ.className = 'typing';
    typ.id = 'typing-indicator';
    typ.innerHTML = '<span style="font-size: 11px; color:#8696a0; margin-right: 4px;">a escrever</span><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    container.appendChild(typ);

    container.scrollTop = container.scrollHeight;
  }

  function renderizarOpcoes() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (opcoesAtivas && opcoesAtivas.chatId === activeChat) {
      opcoesAtivas.lista.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = o.texto;
        btn.onclick = () => {
          container.innerHTML = '';
          const acao = o.proximo;
          opcoesAtivas = null;
          pushMsg(activeChat, 'sent', o.texto, null, () => setTimeout(acao, 500));
        };
        container.appendChild(btn);
      });
      container.scrollTop = 0;
    }
  }

  function pushMsg(chatId, type, text, img = null, callback = null) {
    if (type === 'sent') {
      chatData[chatId].msgs.push({ type, text, img, time: obterHora() });
      guardarEstado();
      if (activeChat === chatId) renderizarMensagens();
      if (callback) callback();
      return;
    }

    if (activeChat === chatId) {
      const typingIndicator = document.getElementById('typing-indicator');
      if (typingIndicator) typingIndicator.style.display = 'flex';

      setTimeout(() => {
        if (typingIndicator) typingIndicator.style.display = 'none';
        chatData[chatId].msgs.push({ type, text, img, time: obterHora() });
        guardarEstado();
        renderizarMensagens();
        if (callback) callback();
      }, 1200);
    } else {
      setTimeout(() => {
        chatData[chatId].msgs.push({ type, text, img, time: obterHora() });
        chatData[chatId].unread += 1;
        guardarEstado();
        if (callback) callback();
      }, 1000);
    }
  }

  function mostrarOpcoes(chatTarget, opcoes) {
    opcoesAtivas = { chatId: chatTarget, lista: opcoes };
    if (activeChat === chatTarget) renderizarOpcoes();
  }

  /* ==================== CAPÍTULO 1 - REDE DE CONTACTOS ==================== */

  function iniciarCapitulo1() {
    atualizarListaGeral();

    // Mensagem inicial do Tomás (O teu melhor amigo racional)
    pushMsg('tomas', 'received', 'Aí ' + playerName + ', viste as notícias de hoje? Está um temporal horrível lá fora.', null, () => {
      pushMsg('tomas', 'received', 'Fica em casa descansado. Amanhã combinamos aquele café.', null, () => {
        
        // Mensagem da Inês (Amiga curiosa e aventureira)
        pushMsg('ines', 'received', 'Ei!! ' + playerName + '! Estás a ver o grupo da faculdade? Dizem que a Marta não aparece há 24 horas!', null, () => {

          // Mensagem da Estranha (Carolina)
          pushMsg('carolina', 'received', 'Desculpa incomodar... Por favor responde. Encontrei este número num bilhete escondido no casaco da minha irmã Marta.', null, () => {
            pushMsg('carolina', 'received', 'A minha irmã desapareceu ontem. No bilhete dizia: "Se algo correr mal, contacta o(a) ' + playerName + '".', null, () => {
              
              abrirChat('carolina');
              mostrarOpcoes('carolina', [
                {
                  texto: "Espera lá... O que dizes? Eu não conheço nenhuma Marta! Deves ter o número errado.",
                  proximo: () => car_resposta_desconfiada()
                },
                {
                  texto: "A Marta?! Como assim? A minha amiga Inês acabou de me dizer que ela estava desaparecida...",
                  proximo: () => car_resposta_preocupada()
                }
              ]);

            });
          });

        });

      });
    });
  }

  function car_resposta_desconfiada() {
    pushMsg('carolina', 'received', 'Não é número errado! O teu nome ' + playerName + ' está escrito à mão no bilhete com este número de telemóvel exacto!', null, () => {
      pushMsg('carolina', 'received', null, 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=500&auto=format&fit=crop&q=80', () => {
        pushMsg('carolina', 'received', 'Olha para isto! Tirei foto. Por favor, diz-me que sabes de alguma coisa...', () => {
          
          mostrarOpcoes('carolina', [
            {
              texto: "Vou falar com os meus amigos Tomás e Inês para perceber se eles sabem de algo e já te digo.",
              proximo: () => consultar_amigos()
            }
          ]);

        });
      });
    });
  }

  function car_resposta_preocupada() {
    pushMsg('carolina', 'received', 'A tua amiga Inês sabe?! Então é verdade, ela desapareceu mesmo...', null, () => {
      pushMsg('carolina', 'received', null, 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=500&auto=format&fit=crop&q=80', () => {
        pushMsg('carolina', 'received', 'Encontrei este bilhete com o teu nome no casaco dela. O que é que ela estava a fazer contigo?!', () => {
          
          mostrarOpcoes('carolina', [
            {
              texto: "Eu juro que não fazia ideia! Dá-me 5 minutos, vou perguntar no meu grupo de amigos.",
              proximo: () => consultar_amigos()
            }
          ]);

        });
      });
    });
  }

  function consultar_amigos() {
    pushMsg('carolina', 'received', 'Por favor, sê rápido(a). Estou desarmada e sozinha no quarto dela...', null, () => {
      
      // Abre a opção para falares com a Inês ou Tomás
      voltarParaLista();

      // Atualiza o chat do Tomás
      pushMsg('tomas', 'received', 'O que se passa? Pareces inquieto(a).');
      // Atualiza o chat da Inês
      pushMsg('ines', 'received', playerName + '! A irmã da Marta ligou-te?! O que é que ela disse?!');

    });
  }

  // Interação no chat da Inês (A favor de investigar)
  function conversaInes() {
    mostrarOpcoes('ines', [
      {
        texto: "Inês, a Carolina diz que a Marta tinha o meu número num bilhete secreto de emergência!",
        proximo: () => {
          pushMsg('ines', 'received', 'O QUÊ?! Meu Deus, isto é assustador e brutal ao mesmo tempo!', null, () => {
            pushMsg('ines', 'received', 'Tu tens de ir ter com a Carolina ou ajudá-la a procurar! Não podes ignorar isto!', null, () => {
              mostrarOpcoes('ines', [
                {
                  texto: "Calma Inês, não vou meter-me numa coisa perigosa sem saber factos.",
                  proximo: () => ines_chateada()
                },
                {
                  texto: "Tens razão, vou ajudá-la a descobrir o que aconteceu.",
                  proximo: () => ines_apoia()
                }
              ]);
            });
          });
        }
      }
    ]);
  }

  function ines_chateada() {
    pushMsg('ines', 'received', 'Sério ' + playerName + '? A rapariga está desaparecida e tu estás com medo?! Que desilusão de amigo(a)...', null, () => {
      chatData.ines.status = "visto por último há 1 min (Chateada)";
      guardarEstado();
      verificarProgressoCap1();
    });
  }

  function ines_apoia() {
    pushMsg('ines', 'received', 'Isso mesmo! Sabia que podia contar contigo! Mantém-me a par de TUDO!', null, () => {
      chatData.ines.status = "online (Amizade +1)";
      guardarEstado();
      verificarProgressoCap1();
    });
  }

  // Interação no chat do Tomás (Contra meter-se em sarilhos)
  function conversaTomas() {
    mostrarOpcoes('tomas', [
      {
        texto: "Tomás, uma tal de Carolina acabou de me mandar mensagem a dizer que a irmã desapareceu e tem o meu número...",
        proximo: () => {
          pushMsg('tomas', 'received', 'Espera lá. Tu conheces essa Carolina? Conheces a irmã?', null, () => {
            pushMsg('tomas', 'received', 'Isto cheira-me a burla ou a problemas sérios com a polícia. Bloqueia esse número agora mesmo!', null, () => {
              mostrarOpcoes('tomas', [
                {
                  texto: "Não posso simplesmente bloquear, Tomás! Se a rapariga estiver mesmo em perigo?",
                  proximo: () => tomas_chateado()
                },
                {
                  texto: "Achas mesmo? Talvez tenhas razão... É melhor ter cuidado.",
                  proximo: () => tomas_concorda()
                }
              ]);
            });
          });
        }
      }
    ]);
  }

  function tomas_chateado() {
    pushMsg('tomas', 'received', 'Depois não digas que não te avisei. Se te meteres em sarilhos com pessoas estranhas à noite, não me venhas pedir ajuda.', null, () => {
      chatData.tomas.status = "visto por último há instantes (Irritado)";
      guardarEstado();
      verificarProgressoCap1();
    });
  }

  function tomas_concorda() {
    pushMsg('tomas', 'received', 'Ainda bem que usas a cabeça. Ganha juízo e deixa a polícia tratar disso.', null, () => {
      chatData.tomas.status = "online (Amizade +1)";
      guardarEstado();
      verificarProgressoCap1();
    });
  }

  function verificarProgressoCap1() {
    // Quando falares com ambos os amigos, a história avança na Carolina
    setTimeout(() => {
      pushMsg('carolina', 'received', playerName + '... Encontrei um diário escondido debaixo do colchão da Marta!', null, () => {
        pushMsg('carolina', 'received', 'Tem uma foto marcada com uma cruz numa praia abandonada e a data de HOJE!', null, () => {
          pushMsg('carolina', 'received', null, 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=500&auto=format&fit=crop&q=80', () => {
            
            // Aparece o Número Desconhecido misterioso a avisar
            chatData.estranho.unlocked = true;
            chatData.estranho.status = "online";
            guardarEstado();

            pushMsg('estranho', 'received', 'Cuidado com o que dizes à Carolina. A irmã dela não é a vítima nesta história.');

          });
        });
      });
    }, 2000);
  }

  // Lógica para detetar quando o jogador clica nos chats dos amigos
  const originalAbrirChat = abrirChat;
  abrirChat = function(id) {
    originalAbrirChat(id);
    if (id === 'ines' && chatData.ines.msgs.length <= 2) {
      conversaInes();
    } else if (id === 'tomas' && chatData.tomas.msgs.length <= 2) {
      conversaTomas();
    }
  };

</script>

</body>
</html>
