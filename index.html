<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp - O Desaparecimento de Sofia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #app { width: 100%; max-width: 480px; height: 100vh; background-color: #0b141a; display: flex; flex-direction: column; position: relative; }
    
    /* CABEÇALHOS */
    header { background-color: #202c33; padding: 12px 16px; display: flex; align-items: center; border-bottom: 1px solid #222d34; justify-content: space-between; z-index: 5; }
    .header-title { font-size: 19px; font-weight: bold; color: #8696a0; }
    .header-chat { display: flex; align-items: center; gap: 10px; width: 100%; }
    .back-btn { background: none; border: none; color: #00a884; font-size: 22px; cursor: pointer; padding-right: 6px; }
    .avatar { min-width: 40px; width: 40px; height: 40px; border-radius: 50%; background-color: #00a884; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; color: #111b21; }
    .user-info { display: flex; flex-direction: column; flex: 1; cursor: pointer; }
    .user-name { font-weight: 600; font-size: 15px; color: #e9edef; }
    .user-status { font-size: 11px; color: #8696a0; }
    
    .rel-badge { font-size: 10px; background: #111b21; padding: 4px 8px; border-radius: 12px; border: 1px solid #00a884; color: #00a884; font-weight: bold; text-align: right; }
    .reset-btn { background-color: #2a3942; border: 1px solid #3b4a54; color: #f1f1f1; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }

    /* LISTA DE CHATS */
    #chat-list-view { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; transition: background 0.2s; }
    .chat-item:active { background-color: #202c33; }
    .chat-item-details { flex: 1; margin-left: 12px; overflow: hidden; }
    .chat-item-header { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .chat-item-name { font-size: 15px; font-weight: 600; color: #e9edef; }
    .chat-item-time { font-size: 11px; color: #8696a0; }
    .chat-item-lastmsg { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ECRÃ DE CHAT INDIVIDUAL */
    #chat-room-view { flex: 1; display: none; flex-direction: column; height: 100%; position: relative; }
    #messages-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 10px 10px; }
    
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; animation: fadeIn 0.2s ease-in-out; }
    .msg-sender { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #00a884; }
    .received { background-color: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
    .sent { background-color: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
    .system { align-self: center; background-color: #182229; color: #ffd279; font-size: 11px; border-radius: 6px; padding: 5px 10px; text-align: center; margin: 6px 0; border: 1px solid #222d34; }
    .msg-time { font-size: 10px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; }

    .typing { align-self: flex-start; background-color: #202c33; padding: 8px 14px; border-radius: 8px; border-top-left-radius: 0; display: none; margin-bottom: 6px; }
    .dots { display: flex; gap: 4px; }
    .dot { width: 5px; height: 5px; background-color: #8696a0; border-radius: 50%; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    #options-container { padding: 10px; background-color: #202c33; border-top: 1px solid #222d34; display: flex; flex-direction: column; gap: 6px; }
    .opt-btn { background-color: #111b21; color: #00a884; border: 1px solid #222d34; padding: 11px; border-radius: 8px; font-size: 13.5px; text-align: left; cursor: pointer; transition: 0.2s; }
    .opt-btn:active { background-color: #222d34; }

    /* MODAL NOME & PERFIL */
    #name-modal, #profile-modal { position: absolute; top:0; left:0; width:100%; height:100%; background: #0b141a; display: flex; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .modal-box { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #222d34; }
    .modal-box h2 { font-size: 18px; margin-bottom: 8px; color: #00a884; }
    .modal-box p { font-size: 13px; color: #8696a0; margin-bottom: 18px; }
    .modal-box input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222d34; background: #111b21; color: #fff; font-size: 16px; margin-bottom: 14px; outline: none; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #00a884; color: #111b21; font-weight: bold; font-size: 15px; cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>

<div id="app">
  <!-- MODAL INICIAL -->
  <div id="name-modal" style="display: none;">
    <div class="modal-box">
      <h2>WHATSAPP</h2>
      <p>Escreve o teu nome para iniciar a investigação.</p>
      <input type="text" id="player-name-input" placeholder="O teu nome..." maxlength="20">
      <button onclick="iniciarJogo()">ENTRAR</button>
    </div>
  </div>

  <!-- MODAL DE PERFIL -->
  <div id="profile-modal" style="display: none;">
    <div class="modal-box">
      <h2 id="prof-title">Perfil do Contacto</h2>
      <p id="prof-desc" style="margin-top:10px; color:#e9edef;">Informações pessoais do contacto.</p>
      
      <div style="margin: 15px 0; background:#111b21; padding:12px; border-radius:8px; border:1px solid #222d34;">
        <span style="font-size:12px; color:#8696a0;">Estatuto de Confiança:</span>
        <div id="prof-status-text" style="font-size:15px; font-weight:bold; color:#ffd279; margin-top:2px;">Desconhecido</div>
        
        <span style="font-size:12px; color:#8696a0; display:block; margin-top:10px;">Afinidade / Confiança:</span>
        <div id="prof-rel-bar" style="font-size:20px; font-weight:bold; color:#00a884; margin-top:2px;">50%</div>
      </div>
      
      <button onclick="fecharPerfil()">FECHAR</button>
    </div>
  </div>

  <!-- CABEÇALHO PRINCIPAL -->
  <header id="main-header">
    <div class="header-title">WhatsApp</div>
    <button class="reset-btn" onclick="reiniciarJogo()">↺ Reiniciar</button>
  </header>

  <!-- CABEÇALHO DO CHAT -->
  <header id="chat-header" style="display: none;">
    <div class="header-chat">
      <button class="back-btn" onclick="voltarParaLista()">❮</button>
      <div class="avatar" id="active-avatar">T</div>
      <div class="user-info" onclick="abrirPerfil()">
        <div class="user-name" id="active-name">Tomás</div>
        <div class="user-status" id="active-status">online</div>
      </div>
      <div class="rel-badge" id="active-rel">Confiança: 50%</div>
    </div>
  </header>

  <!-- ECRÃ 1: LISTA DE CHATS -->
  <div id="chat-list-view"></div>

  <!-- ECRÃ 2: SALA DE CHAT -->
  <div id="chat-room-view">
    <div id="messages-container">
      <div class="typing" id="typing-indicator">
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
    <div id="options-container"></div>
  </div>
</div>

<script>
  let playerName = localStorage.getItem('player_name_duskwood_full') || "";
  let activeChat = null;
  
  let chatData = {
    grupo: {
      name: "Procuro pela Sofia 🔍", avatar: "👥", bg: "#ff9800", status: "Inês, Tomás, Diogo, Tu",
      relacao: 50, unlocked: true, isGroup: true,
      desc: "Grupo criado de urgência pelos amigos da Sofia. Ninguém te conhece.",
      msgs: []
    },
    sofia: { 
      name: "Sofia ❤️", avatar: "S", bg: "#9c27b0", status: "visto por último ontem", 
      relacao: 0, unlocked: true, isGroup: false,
      desc: "A rapariga desaparecida. O teu número foi enviado do telemóvel dela.",
      msgs: [] 
    },
    ines: { 
      name: "Inês", avatar: "I", bg: "#e91e63", status: "online", 
      relacao: 20, unlocked: false, isGroup: false,
      desc: "A amiga cética que lidera o grupo e desconfia de ti.",
      msgs: [] 
    },
    tomas: { 
      name: "Tomás", avatar: "T", bg: "#00a884", status: "online", 
      relacao: 40, unlocked: false, isGroup: false,
      desc: "Amigo da Sofia. O único disposto a dar-te o benefício da dúvida.",
      msgs: [] 
    },
    diogo: { 
      name: "Diogo", avatar: "D", bg: "#607d8b", status: "offline", 
      relacao: 15, unlocked: false, isGroup: false,
      desc: "Ex-namorado impulsivo. Guarda segredos sobre a serra de Monte Cedo.",
      msgs: [] 
    },
    zero: { 
      name: "??? [Anónimo]", avatar: "0", bg: "#e53935", status: "offline", 
      relacao: 10, unlocked: false, isGroup: false,
      desc: "Figura enigmática que monitoriza a rede e promete revelar segredos.",
      msgs: [] 
    }
  };

  function obterHora() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function calcularEstatutoRelaCoes(rel, id) {
    if (id === 'sofia') return "Desaparecida 💔";
    if (id === 'grupo') return "Grupo de Estranhos 👥";
    if (id === 'zero') return "Hacker Anónimo 🕶️";
    if (rel >= 70) return "Aliado Principal ✨";
    if (rel >= 45) return "Neutro 😐";
    return "Altamente Suspeito ❄️";
  }

  function alterarRelacao(chatId, delta) {
    if (chatData[chatId]) {
      chatData[chatId].relacao = Math.min(100, Math.max(0, chatData[chatId].relacao + delta));
      guardarEstado();
      if (activeChat === chatId) {
        document.getElementById('active-rel').innerText = "Confiança: " + chatData[chatId].relacao + "%";
      }
    }
  }

  function reiniciarJogo() {
    if (confirm("Queres reiniciar toda a investigação?")) {
      localStorage.clear();
      location.reload();
    }
  }

  window.onload = function() {
    if (!playerName) {
      document.getElementById('name-modal').style.display = 'flex';
    } else {
      carregarEstado();
    }
  };

  function iniciarJogo() {
    const input = document.getElementById('player-name-input');
    if (!input.value.trim()) return;
    playerName = input.value.trim();
    localStorage.setItem('player_name_duskwood_full', playerName);
    document.getElementById('name-modal').style.display = 'none';
    iniciarHistoria();
  }

  function carregarEstado() {
    const savedData = localStorage.getItem('chat_data_save_duskwood_full_v1');
    if (savedData) {
      chatData = JSON.parse(savedData);
      atualizarListaGeral();
    } else {
      iniciarHistoria();
    }
  }

  function guardarEstado() {
    localStorage.setItem('chat_data_save_duskwood_full_v1', JSON.stringify(chatData));
    atualizarListaGeral();
  }

  function atualizarListaGeral() {
    const listView = document.getElementById('chat-list-view');
    listView.innerHTML = '';

    Object.keys(chatData).forEach(id => {
      const chat = chatData[id];
      if (chat.unlocked) {
        const msgs = chat.msgs;
        let ultTexto = "Nenhuma mensagem...";
        let ultHora = "--:--";

        if (msgs.length > 0) {
          const ult = msgs[msgs.length - 1];
          ultTexto = ult.text ? ult.text.replace(/<[^>]*>?/gm, '') : "Ficheiro";
          if (ult.sender) ultTexto = ult.sender + ": " + ultTexto;
          ultHora = ult.time || obterHora();
        } else if (id === 'sofia') {
          ultTexto = "[Visto por último ontem às 23:14]";
          ultHora = "Ontem";
        }

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => abrirChat(id);
        item.innerHTML = `
          <div class="avatar" style="background-color: ${chat.bg};">${chat.avatar}</div>
          <div class="chat-item-details">
            <div class="chat-item-header">
              <span class="chat-item-name">${chat.name}</span>
              <span class="chat-item-time">${ultHora}</span>
            </div>
            <div class="chat-item-lastmsg">${ultTexto}</div>
          </div>
        `;
        listView.appendChild(item);
      }
    });
  }

  function abrirChat(id) {
    activeChat = id;
    const info = chatData[id];
    
    document.getElementById('main-header').style.display = 'none';
    document.getElementById('chat-list-view').style.display = 'none';
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('chat-room-view').style.display = 'flex';

    document.getElementById('active-name').innerText = info.name;
    document.getElementById('active-status').innerText = info.status;
    document.getElementById('active-avatar').innerText = info.avatar;
    document.getElementById('active-avatar').style.backgroundColor = info.bg;
    document.getElementById('active-rel').innerText = info.isGroup ? "Grupo Geral" : "Confiança: " + info.relacao + "%";

    renderizarMensagens();
  }

  function abrirPerfil() {
    if (!activeChat) return;
    const info = chatData[activeChat];
    document.getElementById('prof-title').innerText = info.name;
    document.getElementById('prof-desc').innerText = info.desc;
    document.getElementById('prof-rel-bar').innerText = info.isGroup ? "N/A" : info.relacao + "%";
    document.getElementById('prof-status-text').innerText = calcularEstatutoRelaCoes(info.relacao, activeChat);
    document.getElementById('profile-modal').style.display = 'flex';
  }

  function fecharPerfil() {
    document.getElementById('profile-modal').style.display = 'none';
  }

  function voltarParaLista() {
    activeChat = null;
    document.getElementById('chat-header').style.display = 'none';
    document.getElementById('chat-room-view').style.display = 'none';
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('chat-list-view').style.display = 'flex';
    atualizarListaGeral();
  }

  function renderizarMensagens() {
    const container = document.getElementById('messages-container');
    container.innerHTML = '';
    
    const msgs = chatData[activeChat].msgs;
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.type;
      
      let htmlContent = "";
      if (m.sender) htmlContent += `<div class="msg-sender">${m.sender}</div>`;
      if (m.type === 'system') htmlContent = m.text;
      else htmlContent += m.text + `<span class="msg-time">${m.time}</span>`;
      
      div.innerHTML = htmlContent;
      container.appendChild(div);
    });

    const typ = document.createElement('div');
    typ.className = 'typing';
    typ.id = 'typing-indicator';
    typ.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    container.appendChild(typ);

    container.scrollTop = container.scrollHeight;
  }

  function pushMsg(chatId, type, text, sender = null) {
    const hora = obterHora();
    if (!chatData[chatId].unlocked) chatData[chatId].unlocked = true;
    chatData[chatId].msgs.push({ type, text, sender, time: hora });
    guardarEstado();
    if (activeChat === chatId) renderizarMensagens();
  }

  function mostrarOpcoes(opcoes) {
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    opcoes.forEach(o => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerText = o.texto;
      btn.onclick = () => {
        container.innerHTML = '';
        pushMsg(activeChat, 'sent', o.texto);
        if (o.delta && o.target) alterarRelacao(o.target, o.delta);
        setTimeout(o.proximo, 600);
      };
      container.appendChild(btn);
    });
  }

  /* ==================== HISTÓRIA COMPLETA (CAPÍTULOS 1 A 5) ==================== */

  function iniciarHistoria() {
    pushMsg('grupo', 'system', '⚠️ FOSTE ADICIONADO AO GRUPO "PROCURO PELA SOFIA"');
    pushMsg('grupo', 'received', 'Quem quer que estejas a ler isto, responde AGORA!', 'Inês');
    pushMsg('grupo', 'received', 'A Sofia desapareceu ontem à noite. A última coisa que saiu do telemóvel dela foi este número!', 'Inês');
    pushMsg('grupo', 'received', 'Inês, tem calma... Podes estar a assustar a pessoa.', 'Tomás');
    pushMsg('grupo', 'received', 'Assustar?! O telemóvel dela está desligado e este número é a única pista que a polícia tem!', 'Diogo');

    abrirChat('grupo');
    
    mostrarOpcoes([
      { 
        texto: "Calma! Eu nem sequer sei quem vocês são nem de onde é essa rapariga!", 
        target: "tomas", delta: +10,
        proximo: () => cap1_reacao_grupo("confuso") 
      },
      { 
        texto: "Vocês estão malucos? Retirem o meu número deste grupo imediatamente.", 
        target: "ines", delta: -10,
        proximo: () => cap1_reacao_grupo("hostil") 
      }
    ]);
  }

  function cap1_reacao_grupo(tipo) {
    if (tipo === "confuso") {
      pushMsg('grupo', 'received', 'Estás a dizer que não conheces a Sofia?! Como é que ela tinha o teu contacto então?!', 'Inês');
      pushMsg('grupo', 'received', 'Eu disse-vos... Pode ser um erro ou alguém a tentar incriminar outra pessoa.', 'Tomás');
      
      setTimeout(() => {
        pushMsg('tomas', 'system', '🔒 MENSAGEM PRIVADA');
        pushMsg('tomas', 'received', 'Olá... Desculpa a reação deles no grupo. O meu nome é Tomás.');
        pushMsg('tomas', 'received', 'Eu acredito que não conheças a Sofia. Mas precisamos de ajuda.');
        alert("📲 Nova Mensagem Privada de Tomás!");
      }, 1500);

    } else {
      pushMsg('grupo', 'received', 'Não vamos tirar nada! A minha amiga está desaparecida!', 'Diogo');
      pushMsg('grupo', 'received', 'Se não tens nada a ver com isto, prova-o!', 'Inês');

      setTimeout(() => {
        pushMsg('ines', 'system', '🔒 MENSAGEM PRIVADA');
        pushMsg('ines', 'received', 'Escuta aqui, ' + playerName + '. Diz-me a verdade de onde conheces a Sofia antes de dar o teu número à polícia.');
        alert("📲 Nova Mensagem Privada de Inês!");
      }, 1500);
    }

    setTimeout(() => {
      pushMsg('zero', 'system', '⚠️ MENSAGEM ENCRIPTADA');
      pushMsg('zero', 'received', 'Não faças o que eles pedem, ' + playerName + '.');
      pushMsg('zero', 'received', 'Eu fui quem enviou o teu número através do telemóvel da Sofia antes de ela ser levada.');
      pushMsg('zero', 'received', 'Tu és a única pessoa de fora da cidade... a única em quem posso confiar.');
      alert("⚡ Alerta: Um contacto anónimo [???] enviou-te uma mensagem encriptada!");
      
      setTimeout(cap2_o_casarao, 3000);
    }, 3000);
  }

  /* CAPÍTULO 2: O CASARÃO E A PRIMEIRA PISTA */
  function cap2_o_casarao() {
    pushMsg('zero', 'received', 'Encontrei um documento antigo da Sofia. Ela estava a investigar a antiga Estação de Tratamento da serra.');
    pushMsg('zero', 'received', 'Lá dentro há um diário trancado com um código numérico. Precisamos de entrar na conta de e-mail dela.');

    if (activeChat === 'zero') {
      mostrarOpcoes([
        { 
          texto: "Como é que eu posso ajudar a descobrir esse código?", 
          target: "zero", delta: +10,
          proximo: () => cap2_investigacao("ajudar") 
        },
        { 
          texto: "Isto é ilegal. Como sei que não foste tu que a raptaste?", 
          target: "zero", delta: -10,
          proximo: () => cap2_investigacao("desconfiar") 
        }
      ]);
    } else {
      setTimeout(cap2_investigacao_auto, 2000);
    }
  }

  function cap2_investigacao(opcao) {
    pushMsg('zero', 'received', 'A Sofia usava como código a data em que o grupo de amigos se zangou no ano passado: 1408.');
    pushMsg('zero', 'received', 'Acedi ao e-mail dela! Há uma mensagem de ontem enviada pelo Diogo...');
    pushMsg('zero', 'received', 'O Diogo disse à Sofia: "Se fores ao casarão logo à noite, não voltas mais".');
    
    setTimeout(() => {
      pushMsg('grupo', 'received', 'Pessoal, o Diogo acabou de sair de casa a correr para a serra!', 'Inês');
      pushMsg('grupo', 'received', 'Ele estava muito nervoso e trazia uma lanterna.', 'Tomás');
      cap3_o_confronto();
    }, 2500);
  }

  function cap2_investigacao_auto() {
    cap2_investigacao("ajudar");
  }

  /* CAPÍTULO 3: O CONFRONTO DO DIOGO & TOMÁS */
  function cap3_o_confronto() {
    pushMsg('diogo', 'system', '🔒 MENSAGEM PRIVADA');
    pushMsg('diogo', 'received', playerName + ', se estás a falar com o Tomás, CUIDADO.');
    pushMsg('diogo', 'received', 'Ele está a mentir-vos a todos! Ele esteve no casarão com a Sofia às 22h!');

    setTimeout(() => {
      pushMsg('tomas', 'received', 'Não acredites no Diogo! Ele encontrou a minha chave do carro e quer incriminar-me!');
      pushMsg('tomas', 'received', 'Em quem é que vais confiar, ' + playerName + '?');
      
      alert("⚠️ Decisão Crítica: Vais confrontar o Tomás ou o Diogo?");
      cap3_escolha();
    }, 2000);
  }

  function cap3_escolha() {
    if (activeChat === 'tomas' || activeChat === 'diogo' || activeChat === 'grupo') {
      mostrarOpcoes([
        { 
          texto: "Tomás, diz-me a verdade! Tu estiveste ou não com a Sofia no casarão?", 
          target: "tomas", delta: -15,
          proximo: () => cap4_revelacao("confrontar_tomas") 
        },
        { 
          texto: "Diogo, tu ameaçaste a Sofia por e-mail! Eu sei de tudo!", 
          target: "diogo", delta: -15,
          proximo: () => cap4_revelacao("confrontar_diogo") 
        }
      ]);
    } else {
      cap4_revelacao("confrontar_tomas");
    }
  }

  /* CAPÍTULO 4: A REVELAÇÃO DO DIÁRIO */
  function cap4_revelacao(escolha) {
    if (escolha === "confrontar_tomas") {
      pushMsg('tomas', 'received', 'Pronto... Eu confesso! Eu fui lá ter com ela... Mas quando cheguei, ela já estava a ser levada por alguém num carro preto!');
    } else {
      pushMsg('diogo', 'received', 'Aquele e-mail foi da boca para fora! Eu queria protegê-la do Tomás!');
    }

    pushMsg('zero', 'received', 'CONSEGUI ACESSO ÀS CÂMARAS DA ESTRADA DA SERRA!');
    pushMsg('zero', 'received', 'Vejo o carro... e vejo a Sofia dentro dele!');
    pushMsg('zero', 'received', 'Ela deixou cair um papel antes de entrar no carro... o teu número estava lá escrito porque era o número de emergência do fórum!');
    
    setTimeout(() => {
      pushMsg('ines', 'received', 'Gente... acabei de receber uma mensagem da Sofia no telemóvel da mãe dela!!');
      pushMsg('ines', 'received', 'Ela diz que está presa na antiga mina perto da Estação de Água!');
      cap5_o_final();
    }, 3000);
  }

  /* CAPÍTULO 5: O CLÍMAX E MÚLTIPLOS FINAIS */
  function cap5_o_final() {
    pushMsg('grupo', 'system', '🚨 MENSAGEM FINAL - HORA DA DECISÃO');
    pushMsg('grupo', 'received', 'Temos de ir lá AGORA! Quem é que avisamos primeiro?', 'Inês');

    const relTomas = chatData.tomas.relacao;
    const relZero = chatData.zero.relacao;

    if (activeChat === 'grupo') {
      mostrarOpcoes([
        { 
          texto: "Avisem a Polícia imediatamente e sigam o Tomás até à mina!", 
          target: "grupo", delta: +10,
          proximo: () => calcularFinal("policia_tomas") 
        },
        { 
          texto: "Confiem no Hacker [Zero]! Ele sabe a localização exata das câmaras!", 
          target: "zero", delta: +20,
          proximo: () => calcularFinal("hacker") 
        }
      ]);
    } else {
      calcularFinal("policia_tomas");
    }
  }

  function calcularFinal(opcao) {
    const relTomas = chatData.tomas.relacao;
    const relZero = chatData.zero.relacao;

    pushMsg('grupo', 'system', '🎬 FIM DA INVESTIGAÇÃO');

    if (opcao === "hacker" || relZero >= 30) {
      // FINAL A: ALIADO DO HACKER
      pushMsg('zero', 'received', 'Obrigado pela tua confiança, ' + playerName + '. Guiando a polícia com a minha localização exata, encontramos a Sofia a salvo!');
      pushMsg('grupo', 'received', 'A SOFIA FOI ENCONTRADA! O raptor era o antigo vigilante da serra!', 'Inês');
      pushMsg('sofia', 'system', '🔓 CHAT REAVIVADO');
      pushMsg('sofia', 'received', 'Obrigada por não desistires de mim, ' + playerName + '... Guardei o teu número porque sabia que um estranho seria o único sem preconceitos na cidade. ❤️');
      alert("🏆 FINAL A: Herói da Cidade! Salvaste a Sofia juntamente com o Hacker Zero!");

    } else if (relTomas >= 50) {
      // FINAL B: CONFIASTE NO TOMÁS
      pushMsg('tomas', 'received', 'Chegámos a tempo! O Diogo estava lá a tentar ajudar a Sofia sozinho e o raptor fugiu ao ver a polícia!');
      pushMsg('grupo', 'received', 'A Sofia está bem no hospital! Obrigado por teres unido o grupo ' + playerName + '!');
      alert("🎉 FINAL B: União do Grupo! Salvaste a Sofia e provaste a inocência dos amigos!");

    } else {
      // FINAL C: CONFIANÇA BAIXA / AMBIGUIDADE
      pushMsg('grupo', 'received', 'A polícia chegou tarde por causa da confusão das chamadas...');
      pushMsg('grupo', 'received', 'A Sofia conseguiu escapar sozinha pela serra, mas ninguém no grupo volta a falar contigo.');
      pushMsg('ines', 'received', 'Nunca deveríamos ter confiado num estranho.');
      alert("⚠️ FINAL C: Verdade Amarga! A Sofia escapou, mas o grupo desfez-se por falta de confiança.");
    }
  }

  function carregarChatSofia() {
    pushMsg('sofia', 'system', '📜 MENSAGENS GUARDADAS - ONTEM 23:10');
    pushMsg('sofia', 'received', 'Se leres isto... não confies em ninguém da cidade.');
  }
</script>
