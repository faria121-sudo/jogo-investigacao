<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #app { width: 100%; max-width: 480px; height: 100vh; height: 100dvh; background-color: #0b141a; display: flex; flex-direction: column; position: relative; }
    
    header { background-color: #202c33; padding: 12px 16px; display: flex; align-items: center; border-bottom: 1px solid #222d34; justify-content: space-between; z-index: 5; flex-shrink: 0; }
    .header-title { font-size: 19px; font-weight: bold; color: #8696a0; }
    .header-chat { display: flex; align-items: center; gap: 10px; width: 100%; }
    .back-btn { background: none; border: none; color: #00a884; font-size: 22px; cursor: pointer; padding-right: 6px; }
    
    .avatar-img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .user-info { display: flex; flex-direction: column; flex: 1; cursor: pointer; }
    .user-name { font-weight: 600; font-size: 15px; color: #e9edef; }
    .user-status { font-size: 11px; color: #8696a0; }
    
    .reset-btn { background-color: #2a3942; border: 1px solid #3b4a54; color: #f1f1f1; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }

    #chat-list-view { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; transition: background 0.2s; position: relative; }
    .chat-item:active { background-color: #202c33; }
    .chat-item-details { flex: 1; margin-left: 12px; overflow: hidden; }
    .chat-item-header { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; }
    .chat-item-name { font-size: 15px; font-weight: 600; color: #e9edef; }
    .chat-item-time { font-size: 11px; color: #8696a0; }
    .chat-item-body { display: flex; justify-content: space-between; align-items: center; }
    .chat-item-lastmsg { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .unread-badge { background-color: #00a884; color: #111b21; font-size: 11px; font-weight: bold; border-radius: 50%; min-width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; padding: 0 4px; }

    #chat-room-view { flex: 1; display: none; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
    #messages-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 10px 10px; scroll-behavior: smooth; }
    
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; animation: slideUp 0.25s ease; }
    .received { background-color: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
    .sent { background-color: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
    .system { align-self: center; background-color: #182229; color: #ffd279; font-size: 11px; border-radius: 6px; padding: 5px 10px; text-align: center; margin: 6px 0; border: 1px solid #222d34; }
    .msg-time { font-size: 10px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; }
    .msg-img { width: 100%; border-radius: 6px; margin-top: 4px; margin-bottom: 2px; cursor: pointer; }

    .typing { align-self: flex-start; background-color: #202c33; padding: 10px 14px; border-radius: 8px; border-top-left-radius: 0; display: none; margin-bottom: 6px; align-items: center; gap: 6px; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 6px; height: 6px; background-color: #8696a0; border-radius: 50%; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    #options-container { padding: 10px; background-color: #202c33; border-top: 1px solid #222d34; display: flex; flex-direction: column; gap: 8px; max-height: 45vh; overflow-y: auto; flex-shrink: 0; }
    .opt-btn { background-color: #111b21; color: #00a884; border: 1px solid #222d34; padding: 12px; border-radius: 8px; font-size: 13.5px; text-align: left; cursor: pointer; transition: background-color 0.2s; line-height: 1.3; }
    .opt-btn:active { background-color: #222d34; }

    #name-modal { position: absolute; top:0; left:0; width:100%; height:100%; background: #0b141a; display: flex; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .modal-box { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #222d34; }
    .modal-box h2 { font-size: 18px; margin-bottom: 8px; color: #00a884; }
    .modal-box p { font-size: 13px; color: #8696a0; margin-bottom: 18px; line-height: 1.4; }
    .modal-box input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222d34; background: #111b21; color: #fff; font-size: 16px; margin-bottom: 14px; outline: none; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #00a884; color: #111b21; font-weight: bold; font-size: 15px; cursor: pointer; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>

<div id="app">
  <div id="name-modal" style="display: flex;">
    <div class="modal-box">
      <h2>WHATSAPP</h2>
      <p>Acabaste o teu dia de trabalho e estás a relaxar no telemóvel. Insere o teu nome verdadeiro para continuar.</p>
      <input type="text" id="player-name-input" placeholder="O teu nome..." maxlength="20">
      <button onclick="iniciarJogo()">LIGAR TELEMÓVEL</button>
    </div>
  </div>

  <header id="main-header">
    <div class="header-title">WhatsApp</div>
    <button class="reset-btn" onclick="reiniciarJogo()">↺ Reiniciar</button>
  </header>

  <header id="chat-header" style="display: none;">
    <div class="header-chat">
      <button class="back-btn" onclick="voltarParaLista()">❮</button>
      <img id="active-avatar-img" class="avatar-img" src="" alt="Avatar">
      <div class="user-info">
        <div class="user-name" id="active-name">Desconhecido</div>
        <div class="user-status" id="active-status">online</div>
      </div>
    </div>
  </header>

  <div id="chat-list-view"></div>

  <div id="chat-room-view">
    <div id="messages-container">
      <div class="typing" id="typing-indicator">
        <span style="font-size: 11px; color:#8696a0; margin-right: 4px;">a escrever</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
    <div id="options-container"></div>
  </div>
</div>

<script>
  let playerName = localStorage.getItem('player_name_v13') || "";
  let activeChat = null;
  let opcoesAtivas = null;

  // Imagens reais de exemplo (Unsplash públicas)
  const chatData = {
    carolina: {
      name: "Carolina", 
      avatarImg: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80",
      status: "online", unlocked: true, unread: 0, msgs: []
    }
  };

  function obterHora() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function reiniciarJogo() {
    if (confirm("Reiniciar história?")) {
      localStorage.clear();
      location.reload();
    }
  }

  window.onload = function() {
    if (playerName) {
      document.getElementById('name-modal').style.display = 'none';
      carregarEstado();
    }
  };

  function iniciarJogo() {
    const input = document.getElementById('player-name-input');
    if (!input.value.trim()) return;
    playerName = input.value.trim();
    localStorage.setItem('player_name_v13', playerName);
    document.getElementById('name-modal').style.display = 'none';
    iniciarHistoria();
  }

  function carregarEstado() {
    const savedData = localStorage.getItem('chat_data_v13');
    if (savedData) {
      Object.assign(chatData, JSON.parse(savedData));
      atualizarListaGeral();
    } else {
      iniciarHistoria();
    }
  }

  function guardarEstado() {
    localStorage.setItem('chat_data_v13', JSON.stringify(chatData));
    atualizarListaGeral();
  }

  function atualizarListaGeral() {
    const listView = document.getElementById('chat-list-view');
    listView.innerHTML = '';

    Object.keys(chatData).forEach(id => {
      const chat = chatData[id];
      if (chat.unlocked) {
        const msgs = chat.msgs;
        let ultTexto = "Nenhuma mensagem...";
        let ultHora = "--:--";

        if (msgs.length > 0) {
          const ult = msgs[msgs.length - 1];
          ultTexto = ult.text ? ult.text.replace(/<[^>]*>?/gm, '') : "[Fotografia]";
          ultHora = ult.time || obterHora();
        }

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => abrirChat(id);
        item.innerHTML = `
          <img src="${chat.avatarImg}" class="avatar-img">
          <div class="chat-item-details">
            <div class="chat-item-header">
              <span class="chat-item-name">${chat.name}</span>
              <span class="chat-item-time">${ultHora}</span>
            </div>
            <div class="chat-item-body">
              <div class="chat-item-lastmsg">${ultTexto}</div>
              ${chat.unread > 0 ? `<div class="unread-badge">${chat.unread}</div>` : ''}
            </div>
          </div>
        `;
        listView.appendChild(item);
      }
    });
  }

  function abrirChat(id) {
    activeChat = id;
    const info = chatData[id];
    info.unread = 0;
    guardarEstado();

    document.getElementById('main-header').style.display = 'none';
    document.getElementById('chat-list-view').style.display = 'none';
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('chat-room-view').style.display = 'flex';

    document.getElementById('active-name').innerText = info.name;
    document.getElementById('active-status').innerText = info.status;
    document.getElementById('active-avatar-img').src = info.avatarImg;

    renderizarMensagens();
    renderizarOpcoes();
  }

  function voltarParaLista() {
    activeChat = null;
    document.getElementById('chat-header').style.display = 'none';
    document.getElementById('chat-room-view').style.display = 'none';
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('chat-list-view').style.display = 'flex';
    atualizarListaGeral();
  }

  function renderizarMensagens() {
    const container = document.getElementById('messages-container');
    container.innerHTML = '';
    
    const msgs = chatData[activeChat].msgs;
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.type;
      let htmlContent = "";
      if (m.img) htmlContent += `<img src="${m.img}" class="msg-img" onclick="window.open('${m.img}')">`;
      if (m.text) htmlContent += m.text;
      htmlContent += `<span class="msg-time">${m.time}</span>`;
      div.innerHTML = htmlContent;
      container.appendChild(div);
    });

    const typ = document.createElement('div');
    typ.className = 'typing';
    typ.id = 'typing-indicator';
    typ.innerHTML = '<span style="font-size: 11px; color:#8696a0; margin-right: 4px;">a escrever</span><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    container.appendChild(typ);

    container.scrollTop = container.scrollHeight;
  }

  function renderizarOpcoes() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (opcoesAtivas && opcoesAtivas.chatId === activeChat) {
      opcoesAtivas.lista.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = o.texto;
        btn.onclick = () => {
          container.innerHTML = '';
          const acao = o.proximo;
          opcoesAtivas = null;
          pushMsg(activeChat, 'sent', o.texto, null, () => setTimeout(acao, 500));
        };
        container.appendChild(btn);
      });
      container.scrollTop = 0;
    }
  }

  function pushMsg(chatId, type, text, img = null, callback = null) {
    if (type === 'sent') {
      chatData[chatId].msgs.push({ type, text, img, time: obterHora() });
      guardarEstado();
      if (activeChat === chatId) renderizarMensagens();
      if (callback) callback();
      return;
    }

    if (activeChat === chatId) {
      const typingIndicator = document.getElementById('typing-indicator');
      if (typingIndicator) typingIndicator.style.display = 'flex';

      setTimeout(() => {
        if (typingIndicator) typingIndicator.style.display = 'none';
        chatData[chatId].msgs.push({ type, text, img, time: obterHora() });
        guardarEstado();
        renderizarMensagens();
        if (callback) callback();
      }, 1500);
    } else {
      setTimeout(() => {
        chatData[chatId].msgs.push({ type, text, img, time: obterHora() });
        chatData[chatId].unread += 1;
        guardarEstado();
        if (callback) callback();
      }, 1000);
    }
  }

  function mostrarOpcoes(chatTarget, opcoes) {
    opcoesAtivas = { chatId: chatTarget, lista: opcoes };
    if (activeChat === chatTarget) renderizarOpcoes();
  }

  /* ==================== A NOVA PREMISSA REALISTA ==================== */

  function iniciarHistoria() {
    atualizarListaGeral();
    
    // O jogo começa com o telemóvel do jogador a tocar no final do dia
    setTimeout(() => {
      pushMsg('carolina', 'received', 'Olá... Desculpa incomodar a esta hora.', null, () => {
        pushMsg('carolina', 'received', 'Sei que não nos conhecemos, mas encontrei este número num bilhete dobrado dentro do casaco da minha irmã.', null, () => {
          pushMsg('carolina', 'received', 'Ela não vem para casa desde ontem. Dizia no bilhete: "Se algo me acontecer, fala com o número ' + playerName + '".', null, () => {
            pushMsg('carolina', 'received', null, 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=500&auto=format&fit=crop&q=80', () => {
              pushMsg('carolina', 'received', 'Tirei foto ao bilhete... Tu conheces a minha irmã? Sabes quem é ela?', () => {
                abrirChat('carolina');
                mostrarOpcoes('carolina', [
                  { 
                    texto: "Boa noite. Acho que há aqui um engano grave, eu nunca vi essa pessoa nem essa letra.", 
                    proximo: () => cap1_engano() 
                  },
                  { 
                    texto: "Calma... Eu sou o(a) " + playerName + ", mas não faço ideia de quem seja a tua irmã. O que é que se passa?", 
                    proximo: () => cap1_explicar_quem_sou() 
                  }
                ]);
              });
            });
          });
        });
      });
    }, 1000);
  }

  function cap1_engano() {
    pushMsg('carolina', 'received', 'Um engano? Mas o teu nome está escrito no bilhete exatamente assim... ' + playerName + '.', null, () => {
      pushMsg('carolina', 'received', 'Por favor não desligues. Estou sozinha no quarto dela e estou assustada com o que acabei de encontrar na secretária dela...', null, () => {
        mostrarOpcoes('carolina', [
          { 
            texto: "O que é que encontraste na secretária? Mostra-me.", 
            proximo: () => cap2_revelacao_foto() 
          }
        ]);
      });
    });
  }

  function cap1_explicar_quem_sou() {
    pushMsg('carolina', 'received', 'Eu chamo-me Carolina. A minha irmã chama-se Marta... Ela tem 22 anos.', null, () => {
      pushMsg('carolina', 'received', 'Se tu não a conheces, porque é que ela guardava o teu contacto como emergência?!', null, () => {
        mostrarOpcoes('carolina', [
          { 
            texto: "Também gostava de perceber... O que é que ela estava a fazer antes de desaparecer?", 
            proximo: () => cap2_revelacao_foto() 
          }
        ]);
      });
    });
  }

  function cap2_revelacao_foto() {
    pushMsg('carolina', 'received', 'Olha para isto. Encontrei um portátil aberto com este mapa e uma foto impressa.', null, () => {
      pushMsg('carolina', 'received', null, 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=500&auto=format&fit=crop&q=80', () => {
        pushMsg('carolina', 'received', 'Tem uma localização marcada na praia da cidade e uma data: HOJE. Achas que devo ir lá ver?', null, () => {
          mostrarOpcoes('carolina', [
            { 
              texto: "Não vás sozinha a lado nenhum à noite! Diz-me a morada para tentar perceber o que é esse sítio.", 
              proximo: () => alert("Continuava aqui com a Carolina a enviar-te pistas reais para tu investigares no teu ritmo.") 
            }
          ]);
        });
      });
    });
  }
</script>

</body>
</html>
