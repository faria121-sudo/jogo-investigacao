<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WhatsApp - O Desaparecimento de Sofia</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
    #app { width: 100%; max-width: 480px; height: 100vh; background-color: #0b141a; display: flex; flex-direction: column; position: relative; }
    
    header { background-color: #202c33; padding: 12px 16px; display: flex; align-items: center; border-bottom: 1px solid #222d34; justify-content: space-between; z-index: 5; }
    .header-title { font-size: 19px; font-weight: bold; color: #8696a0; }
    .header-chat { display: flex; align-items: center; gap: 10px; width: 100%; }
    .back-btn { background: none; border: none; color: #00a884; font-size: 22px; cursor: pointer; padding-right: 6px; }
    .avatar { min-width: 40px; width: 40px; height: 40px; border-radius: 50%; background-color: #00a884; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; color: #111b21; position: relative; }
    .user-info { display: flex; flex-direction: column; flex: 1; cursor: pointer; }
    .user-name { font-weight: 600; font-size: 15px; color: #e9edef; }
    .user-status { font-size: 11px; color: #8696a0; transition: color 0.3s; }
    .user-status.online { color: #00a884; }
    
    .rel-badge { font-size: 10px; background: #111b21; padding: 4px 8px; border-radius: 12px; border: 1px solid #00a884; color: #00a884; font-weight: bold; text-align: right; }
    .reset-btn { background-color: #2a3942; border: 1px solid #3b4a54; color: #f1f1f1; padding: 5px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; }

    #chat-list-view { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .chat-item { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid #182229; cursor: pointer; transition: background 0.2s; position: relative; }
    .chat-item:active { background-color: #202c33; }
    .chat-item-details { flex: 1; margin-left: 12px; overflow: hidden; }
    .chat-item-header { display: flex; justify-content: space-between; margin-bottom: 3px; align-items: center; }
    .chat-item-name { font-size: 15px; font-weight: 600; color: #e9edef; }
    .chat-item-time { font-size: 11px; color: #8696a0; }
    .chat-item-body { display: flex; justify-content: space-between; align-items: center; }
    .chat-item-lastmsg { font-size: 13px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 8px; }
    
    .unread-badge { background-color: #00a884; color: #111b21; font-size: 11px; font-weight: bold; border-radius: 50%; min-width: 18px; height: 18px; display: flex; justify-content: center; align-items: center; padding: 0 4px; animation: pop 0.2s ease-out; }

    #chat-room-view { flex: 1; display: none; flex-direction: column; height: 100%; position: relative; }
    #messages-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 10px 10px; scroll-behavior: smooth; }
    
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; animation: slideUp 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .msg-sender { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #00a884; }
    .received { background-color: #202c33; align-self: flex-start; color: #e9edef; border-top-left-radius: 0; }
    .sent { background-color: #005c4b; align-self: flex-end; color: #e9edef; border-top-right-radius: 0; }
    .system { align-self: center; background-color: #182229; color: #ffd279; font-size: 11px; border-radius: 6px; padding: 5px 10px; text-align: center; margin: 6px 0; border: 1px solid #222d34; }
    .msg-time { font-size: 10px; color: #8696a0; float: right; margin-top: 4px; margin-left: 8px; }

    .typing { align-self: flex-start; background-color: #202c33; padding: 10px 14px; border-radius: 8px; border-top-left-radius: 0; display: none; margin-bottom: 6px; align-items: center; gap: 6px; }
    .dots { display: flex; gap: 4px; align-items: center; }
    .dot { width: 6px; height: 6px; background-color: #8696a0; border-radius: 50%; animation: blink 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }

    #options-container { padding: 10px; background-color: #202c33; border-top: 1px solid #222d34; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
    .opt-btn { background-color: #111b21; color: #00a884; border: 1px solid #222d34; padding: 12px; border-radius: 8px; font-size: 13.5px; text-align: left; cursor: pointer; transition: transform 0.1s, background-color 0.2s; animation: fadeIn 0.3s ease-in; }
    .opt-btn:active { background-color: #222d34; transform: scale(0.98); }

    #name-modal, #profile-modal { position: absolute; top:0; left:0; width:100%; height:100%; background: #0b141a; display: flex; justify-content: center; align-items: center; z-index: 10; padding: 20px; }
    .modal-box { background: #202c33; padding: 25px; border-radius: 12px; width: 100%; max-width: 340px; text-align: center; border: 1px solid #222d34; }
    .modal-box h2 { font-size: 18px; margin-bottom: 8px; color: #00a884; }
    .modal-box p { font-size: 13px; color: #8696a0; margin-bottom: 18px; }
    .modal-box input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #222d34; background: #111b21; color: #fff; font-size: 16px; margin-bottom: 14px; outline: none; }
    .modal-box button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #00a884; color: #111b21; font-weight: bold; font-size: 15px; cursor: pointer; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>
</head>
<body>

<div id="app">
  <div id="name-modal" style="display: none;">
    <div class="modal-box">
      <h2>WHATSAPP</h2>
      <p>Escreve o teu nome para iniciar a investigação de Monte Cedo.</p>
      <input type="text" id="player-name-input" placeholder="O teu nome..." maxlength="20">
      <button onclick="iniciarJogo()">INICIAR CASO</button>
    </div>
  </div>

  <div id="profile-modal" style="display: none;">
    <div class="modal-box">
      <h2 id="prof-title">Perfil do Contacto</h2>
      <p id="prof-desc" style="margin-top:10px; color:#e9edef;">Informações do contacto.</p>
      <div style="margin: 15px 0; background:#111b21; padding:12px; border-radius:8px; border:1px solid #222d34;">
        <span style="font-size:12px; color:#8696a0;">Nível de Confiança:</span>
        <div id="prof-rel-bar" style="font-size:20px; font-weight:bold; color:#00a884; margin-top:2px;">50%</div>
        <span style="font-size:12px; color:#8696a0; display:block; margin-top:10px;">Estado da Relação:</span>
        <div id="prof-status-text" style="font-size:14px; font-weight:bold; color:#ffd279; margin-top:2px;">Neutro</div>
      </div>
      <button onclick="fecharPerfil()">VOLTAR</button>
    </div>
  </div>

  <header id="main-header">
    <div class="header-title">WhatsApp</div>
    <button class="reset-btn" onclick="reiniciarJogo()">↺ Reiniciar</button>
  </header>

  <header id="chat-header" style="display: none;">
    <div class="header-chat">
      <button class="back-btn" onclick="voltarParaLista()">❮</button>
      <div class="avatar" id="active-avatar">T</div>
      <div class="user-info" onclick="abrirPerfil()">
        <div class="user-name" id="active-name">Tomás</div>
        <div class="user-status" id="active-status">online</div>
      </div>
      <div class="rel-badge" id="active-rel">Confiança: 50%</div>
    </div>
  </header>

  <div id="chat-list-view"></div>

  <div id="chat-room-view">
    <div id="messages-container">
      <div class="typing" id="typing-indicator">
        <span style="font-size: 11px; color:#8696a0; margin-right: 4px;" id="typing-name">a escrever</span>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>
    </div>
    <div id="options-container"></div>
  </div>
</div>

<script>
  let playerName = localStorage.getItem('player_name_long_v8') || "";
  let activeChat = null;
  let opcoesAtivas = null;

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function tocarSom(tipo) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      if (tipo === 'recebido') {
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
      } else if (tipo === 'enviado') {
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      }
    } catch (e) {}
  }

  let chatData = {
    grupo: {
      name: "Monte Cedo Crew 🔍", avatar: "👥", bg: "#ff9800", status: "Inês, Tomás, Diogo, Tu",
      relacao: 50, unlocked: true, isGroup: true, unread: 0,
      desc: "Grupo de amigos de Monte Cedo.", msgs: []
    },
    sofia: { 
      name: "Sofia ❤️", avatar: "S", bg: "#9c27b0", status: "visto por último ontem às 23:14", 
      relacao: 0, unlocked: true, isGroup: false, unread: 0,
      desc: "A rapariga desaparecida na serra.", msgs: [] 
    },
    ines: { 
      name: "Inês", avatar: "I", bg: "#e91e63", status: "online", 
      relacao: 30, unlocked: false, isGroup: false, unread: 0,
      desc: "A organizadora do grupo.", msgs: [] 
    },
    tomas: { 
      name: "Tomás", avatar: "T", bg: "#00a884", status: "online", 
      relacao: 40, unlocked: false, isGroup: false, unread: 0,
      desc: "Disposto a confiar em ti.", msgs: [] 
    },
    diogo: { 
      name: "Diogo", avatar: "D", bg: "#607d8b", status: "offline", 
      relacao: 25, unlocked: false, isGroup: false, unread: 0,
      desc: "Ex-namorado impulsivo.", msgs: [] 
    },
    zero: { 
      name: "??? [Anónimo]", avatar: "0", bg: "#e53935", status: "offline", 
      relacao: 15, unlocked: false, isGroup: false, unread: 0,
      desc: "Hacker anónimo.", msgs: [] 
    }
  };

  function obterHora() {
    const d = new Date();
    return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
  }

  function calcularEstatutoRelaCoes(rel, id) {
    if (id === 'sofia') return "Desaparecida 💔";
    if (id === 'grupo') return "Grupo de Monte Cedo 👥";
    if (id === 'zero') return "Contacto Anónimo / Hacker 🕶️";
    if (rel >= 70) return "Confiança Total ✨";
    if (rel >= 40) return "Contacto Neutro 😐";
    return "Sob Forte Suspeita ❄️";
  }

  function alterarRelacao(chatId, delta) {
    if (chatData[chatId]) {
      chatData[chatId].relacao = Math.min(100, Math.max(0, chatData[chatId].relacao + delta));
      guardarEstado();
      if (activeChat === chatId) {
        document.getElementById('active-rel').innerText = "Confiança: " + chatData[chatId].relacao + "%";
      }
    }
  }

  function reiniciarJogo() {
    if (confirm("Tens a certeza que queres reiniciar o jogo?")) {
      localStorage.clear();
      location.reload();
    }
  }

  window.onload = function() {
    if (!playerName) {
      document.getElementById('name-modal').style.display = 'flex';
    } else {
      carregarEstado();
    }
  };

  function iniciarJogo() {
    const input = document.getElementById('player-name-input');
    if (!input.value.trim()) return;
    playerName = input.value.trim();
    localStorage.setItem('player_name_long_v8', playerName);
    document.getElementById('name-modal').style.display = 'none';
    iniciarHistoria();
  }

  function carregarEstado() {
    const savedData = localStorage.getItem('chat_data_save_long_v8');
    if (savedData) {
      chatData = JSON.parse(savedData);
      atualizarListaGeral();
    } else {
      iniciarHistoria();
    }
  }

  function guardarEstado() {
    localStorage.setItem('chat_data_save_long_v8', JSON.stringify(chatData));
    atualizarListaGeral();
  }

  function atualizarListaGeral() {
    const listView = document.getElementById('chat-list-view');
    listView.innerHTML = '';

    Object.keys(chatData).forEach(id => {
      const chat = chatData[id];
      if (chat.unlocked) {
        const msgs = chat.msgs;
        let ultTexto = "Nenhuma mensagem...";
        let ultHora = "--:--";

        if (msgs.length > 0) {
          const ult = msgs[msgs.length - 1];
          ultTexto = ult.text ? ult.text.replace(/<[^>]*>?/gm, '') : "Ficheiro";
          if (ult.sender) ultTexto = ult.sender + ": " + ultTexto;
          ultHora = ult.time || obterHora();
        }

        const unreadBadgeHTML = chat.unread > 0 
          ? `<div class="unread-badge">${chat.unread}</div>` 
          : '';

        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => abrirChat(id);
        item.innerHTML = `
          <div class="avatar" style="background-color: ${chat.bg};">${chat.avatar}</div>
          <div class="chat-item-details">
            <div class="chat-item-header">
              <span class="chat-item-name">${chat.name}</span>
              <span class="chat-item-time" style="${chat.unread > 0 ? 'color:#00a884; font-weight:bold;' : ''}">${ultHora}</span>
            </div>
            <div class="chat-item-body">
              <div class="chat-item-lastmsg">${ultTexto}</div>
              ${unreadBadgeHTML}
            </div>
          </div>
        `;
        listView.appendChild(item);
      }
    });
  }

  function abrirChat(id) {
    activeChat = id;
    const info = chatData[id];
    info.unread = 0;
    guardarEstado();

    document.getElementById('main-header').style.display = 'none';
    document.getElementById('chat-list-view').style.display = 'none';
    document.getElementById('chat-header').style.display = 'flex';
    document.getElementById('chat-room-view').style.display = 'flex';

    document.getElementById('active-name').innerText = info.name;
    document.getElementById('active-status').innerText = info.status;
    document.getElementById('active-avatar').innerText = info.avatar;
    document.getElementById('active-avatar').style.backgroundColor = info.bg;
    document.getElementById('active-rel').innerText = info.isGroup ? "Grupo Geral" : "Confiança: " + info.relacao + "%";

    renderizarMensagens();
    renderizarOpcoes();
  }

  function abrirPerfil() {
    if (!activeChat) return;
    const info = chatData[activeChat];
    document.getElementById('prof-title').innerText = info.name;
    document.getElementById('prof-desc').innerText = info.desc;
    document.getElementById('prof-rel-bar').innerText = info.isGroup ? "N/A" : info.relacao + "%";
    document.getElementById('prof-status-text').innerText = calcularEstatutoRelaCoes(info.relacao, activeChat);
    document.getElementById('profile-modal').style.display = 'flex';
  }

  function fecharPerfil() {
    document.getElementById('profile-modal').style.display = 'none';
  }

  function voltarParaLista() {
    activeChat = null;
    document.getElementById('chat-header').style.display = 'none';
    document.getElementById('chat-room-view').style.display = 'none';
    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('chat-list-view').style.display = 'flex';
    atualizarListaGeral();
  }

  function renderizarMensagens() {
    const container = document.getElementById('messages-container');
    container.innerHTML = '';
    
    const msgs = chatData[activeChat].msgs;
    msgs.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.type;
      let htmlContent = "";
      if (m.sender) htmlContent += `<div class="msg-sender">${m.sender}</div>`;
      if (m.type === 'system') htmlContent = m.text;
      else htmlContent += m.text + `<span class="msg-time">${m.time}</span>`;
      div.innerHTML = htmlContent;
      container.appendChild(div);
    });

    const typ = document.createElement('div');
    typ.className = 'typing';
    typ.id = 'typing-indicator';
    typ.innerHTML = '<span style="font-size: 11px; color:#8696a0; margin-right: 4px;" id="typing-name">a escrever</span><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
    container.appendChild(typ);

    container.scrollTop = container.scrollHeight;
  }

  function renderizarOpcoes() {
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (opcoesAtivas && opcoesAtivas.chatId === activeChat) {
      opcoesAtivas.lista.forEach(o => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = o.texto;
        btn.onclick = () => {
          container.innerHTML = '';
          const acao = o.proximo;
          const delta = o.delta;
          const target = o.target;
          opcoesAtivas = null;
          
          pushMsg(activeChat, 'sent', o.texto, null, () => {
            if (delta && target) alterarRelacao(target, delta);
            setTimeout(acao, 600);
          });
        };
        container.appendChild(btn);
      });
    }
  }

  function pushMsg(chatId, type, text, sender = null, callback = null) {
    if (!chatData[chatId].unlocked) chatData[chatId].unlocked = true;

    if (type === 'sent' || type === 'system') {
      const hora = obterHora();
      chatData[chatId].msgs.push({ type, text, sender, time: hora });
      guardarEstado();
      if (activeChat === chatId) {
        renderizarMensagens();
        if (type === 'sent') tocarSom('enviado');
      }
      if (callback) callback();
      return;
    }

    const baseTyping = Math.min(Math.max(text.length * 25, 1000), 2500);

    if (activeChat === chatId) {
      const typingIndicator = document.getElementById('typing-indicator');
      const typingName = document.getElementById('typing-name');
      
      if (typingIndicator) {
        typingName.innerText = sender ? `${sender} está a escrever` : "a escrever";
        typingIndicator.style.display = 'flex';
        const container = document.getElementById('messages-container');
        container.scrollTop = container.scrollHeight;
      }

      setTimeout(() => {
        if (typingIndicator) typingIndicator.style.display = 'none';
        const hora = obterHora();
        chatData[chatId].msgs.push({ type, text, sender, time: hora });
        guardarEstado();
        if (activeChat === chatId) {
          renderizarMensagens();
          tocarSom('recebido');
        }
        if (callback) callback();
      }, baseTyping);

    } else {
      setTimeout(() => {
        const hora = obterHora();
        chatData[chatId].msgs.push({ type, text, sender, time: hora });
        chatData[chatId].unread += 1;
        guardarEstado();
        if (callback) callback();
      }, baseTyping / 1.5);
    }
  }

  function mostrarOpcoes(chatTarget, opcoes) {
    opcoesAtivas = {
      chatId: chatTarget,
      lista: opcoes
    };
    setTimeout(() => {
      if (activeChat !== chatTarget) {
        abrirChat(chatTarget);
      } else {
        renderizarOpcoes();
      }
    }, 400);
  }

  /* ==================== HISTÓRIA CORRIGIDA ==================== */

  function iniciarHistoria() {
    pushMsg('grupo', 'system', '⚠️ FOSTE ADICIONADO AO GRUPO "MONTE CEDO CREW"');
    
    pushMsg('grupo', 'received', 'Alguém me explica quem é este número que a Sofia enviou antes de desligar?!', 'Inês', () => {
      pushMsg('grupo', 'received', 'Calma Inês, não ataques logo a pessoa.', 'Tomás', () => {
        pushMsg('grupo', 'received', 'Calma?! A polícia está na casa dela e a única pista é este contacto!', 'Diogo', () => {
          abrirChat('grupo');
          mostrarOpcoes('grupo', [
            { 
              texto: "Eu nem sequer vivo na vossa cidade! Não faço ideia de quem é a Sofia!", 
              target: "tomas", delta: +10,
              proximo: () => cap1_desenvolvimento("compreensivo") 
            },
            { 
              texto: "Quem são vocês para me falarem assim? Apaguem o meu número!", 
              target: "ines", delta: -10,
              proximo: () => cap1_desenvolvimento("agressivo") 
            }
          ]);
        });
      });
    });
  }

  function cap1_desenvolvimento(estilo) {
    if (estilo === "compreensivo") {
      pushMsg('grupo', 'received', 'Se não a conheces, por que motivo é que ela guardou o teu contacto como EMERGÊNCIA?', 'Inês', () => {
        pushMsg('grupo', 'received', 'Há algo que não bate certo.', 'Tomás', () => {
          pushMsg('tomas', 'system', '🔒 MENSAGEM PRIVADA');
          pushMsg('tomas', 'received', 'Desculpa a Inês. Estamos em choque desde ontem à noite.', 'Tomás');
        });
      });
    } else {
      pushMsg('grupo', 'received', 'Se a Sofia te mandou o número, estás envolvido!', 'Diogo', () => {
        pushMsg('ines', 'system', '🔒 MENSAGEM PRIVADA');
        pushMsg('ines', 'received', 'Ouve bem, ' + playerName + '. Se não ajudares, vou à polícia.', 'Inês');
      });
    }

    setTimeout(() => {
      pushMsg('zero', 'system', '⚠️ MENSAGEM ENCRIPTADA');
      pushMsg('zero', 'received', 'Aviso: Não confies em nenhum deles.', '???', () => {
        pushMsg('zero', 'received', 'Eu usei o telemóvel da Sofia para enviar o teu número para o grupo.', '???', () => {
          pushMsg('zero', 'received', 'Preciso de alguém neutro para desmascarar a verdade.', '???', () => {
            cap2_investigacao_inicial();
          });
        });
      });
    }, 1800);
  }

  function cap2_investigacao_inicial() {
